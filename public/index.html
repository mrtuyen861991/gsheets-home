<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GSHEETS HOME - Homestay | Nghỉ Dưỡng (v1.0)</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- React 18, ReactDOM & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    /* Calendar diagonal stripes for maintenance */
    .bg-striped-diagonal {
      background: repeating-linear-gradient(
        45deg,
        rgba(239, 68, 68, 0.08),
        rgba(239, 68, 68, 0.08) 10px,
        rgba(239, 68, 68, 0.18) 10px,
        rgba(239, 68, 68, 0.18) 20px
      );
    }
    .booking-bar {
      transition: all 0.15s ease-in-out;
    }
    .booking-bar:hover {
      filter: brightness(0.95);
      transform: translateY(-1px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Format currency to VND
    const formatVND = (num) => {
      if (num === null || num === undefined || isNaN(num)) return '0 đ';
      return Math.round(num).toLocaleString('vi-VN') + ' đ';
    };

    // Main App Component
    function App() {
      // 1. App State
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [currentUser, setCurrentUser] = useState(null);
      const [currentScreen, setCurrentScreen] = useState('dashboard'); // dashboard, calendar, bookings, housekeeping, payments, customers, reports, properties, users, settings, guide
      const [selectedPropertyFilter, setSelectedPropertyFilter] = useState('all');
      const [globalSearch, setGlobalSearch] = useState('');
      const [toast, setToast] = useState(null);
      const [userMenuOpen, setUserMenuOpen] = useState(false);
      const [syncingGSheets, setSyncingGSheets] = useState(false);

      // Modals
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [showNewBookingModal, setShowNewBookingModal] = useState(false);
      const [showGroupBookingModal, setShowGroupBookingModal] = useState(false);
      const [showPaymentModal, setShowPaymentModal] = useState(false);
      const [showCustomerModal, setShowCustomerModal] = useState(false);
      const [showUserModal, setShowUserModal] = useState(false);
      const [showVoucherModal, setShowVoucherModal] = useState(false);
      const [selectedBookingForVoucher, setSelectedBookingForVoucher] = useState(null);
      const [selectedBookingDetail, setSelectedBookingDetail] = useState(null);
      const [bookingModalInitialData, setBookingModalInitialData] = useState(null);

      // Show toast helper
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Fetch data
      const refreshData = async () => {
        try {
          const res = await fetch('/api/bootstrap');
          const json = await res.json();
          setData(json);
          if (!currentUser && json.users && json.users.length) {
            // Default to admin
            setCurrentUser(json.users[0]);
          }
          setLoading(false);
        } catch (err) {
          console.error('Fetch error:', err);
          showToast('Lỗi tải dữ liệu: ' + err.message, 'error');
          setLoading(false);
        }
      };

      useEffect(() => {
        refreshData();
      }, []);

      // Filtered properties based on user scope
      const userAllowedProperties = useMemo(() => {
        if (!data || !data.properties) return [];
        if (!currentUser || currentUser.propertyScope === 'all') {
          return data.properties;
        }
        return data.properties.filter(p => p.id === currentUser.propertyScope);
      }, [data, currentUser]);

      // Filtered rooms
      const filteredRooms = useMemo(() => {
        if (!data || !data.rooms) return [];
        let list = data.rooms;
        // User property scope
        if (currentUser && currentUser.propertyScope !== 'all') {
          list = list.filter(r => r.propertyId === currentUser.propertyScope);
        }
        // User selected property
        if (selectedPropertyFilter !== 'all') {
          list = list.filter(r => r.propertyId === selectedPropertyFilter);
        }
        return list;
      }, [data, currentUser, selectedPropertyFilter]);

      // Filtered bookings
      const filteredBookings = useMemo(() => {
        if (!data || !data.bookings) return [];
        let list = data.bookings;
        if (currentUser && currentUser.propertyScope !== 'all') {
          list = list.filter(b => b.propertyId === currentUser.propertyScope);
        }
        if (selectedPropertyFilter !== 'all') {
          list = list.filter(b => b.propertyId === selectedPropertyFilter);
        }
        if (globalSearch.trim()) {
          const q = globalSearch.toLowerCase().trim();
          list = list.filter(b =>
            (b.id && b.id.toLowerCase().includes(q)) ||
            (b.customerName && b.customerName.toLowerCase().includes(q)) ||
            (b.customerPhone && b.customerPhone.includes(q)) ||
            (b.roomName && b.roomName.toLowerCase().includes(q))
          );
        }
        return list;
      }, [data, currentUser, selectedPropertyFilter, globalSearch]);

      // Switch user
      const handleSwitchUser = (userObj) => {
        setCurrentUser(userObj);
        setUserMenuOpen(false);
        showToast(`Đã chuyển sang tài khoản: ${userObj.name} (${userObj.roleLabel})`);
      };

      // Check permission
      const hasPermission = (moduleName, action = 'view') => {
        if (!currentUser) return false;
        if (currentUser.role === 'admin') return true;
        const modPerm = currentUser.permissions && currentUser.permissions[moduleName];
        if (!modPerm) return false;
        return !!modPerm[action];
      };

      // 1-touch Check-in
      const handleCheckIn = async (bookingId) => {
        try {
          const res = await fetch(`/api/bookings/${bookingId}/checkin`, { method: 'POST' });
          if (res.ok) {
            showToast('✅ Đã nhận phòng thành công!');
            refreshData();
          }
        } catch (e) {
          showToast('Lỗi nhận phòng: ' + e.message, 'error');
        }
      };

      // 1-touch Check-out
      const handleCheckOut = async (bookingId) => {
        try {
          const res = await fetch(`/api/bookings/${bookingId}/checkout`, { method: 'POST' });
          if (res.ok) {
            showToast('✅ Đã trả phòng thành công! Phòng đã được gắn nhãn Cần dọn dẹp.');
            refreshData();
          }
        } catch (e) {
          showToast('Lỗi trả phòng: ' + e.message, 'error');
        }
      };

      // Clean all rooms in 1 click
      const handleCleanAll = async () => {
        try {
          const res = await fetch('/api/rooms/clean-all', { method: 'POST' });
          const json = await res.json();
          showToast(`🧹 Đã dọn dẹp tất cả ${json.cleanedCount || 0} phòng bẩn thành phòng sạch!`);
          refreshData();
        } catch (e) {
          showToast('Lỗi: ' + e.message, 'error');
        }
      };

      // Sync Google Sheets
      const handleSyncGoogleSheets = async () => {
        setSyncingGSheets(true);
        try {
          const res = await fetch('/api/sync/gsheets', { method: 'POST' });
          const json = await res.json();
          setSyncingGSheets(false);
          showToast('📊 ' + json.message);
        } catch (e) {
          setSyncingGSheets(false);
          showToast('Lỗi đồng bộ Google Sheets: ' + e.message, 'error');
        }
      };

      // Open new booking modal from calendar drag / select
      const handleOpenBookingWithRange = (roomId, checkInDate, checkOutDate) => {
        const room = (data.rooms || []).find(r => r.id === roomId);
        setBookingModalInitialData({
          roomId,
          propertyId: room ? room.propertyId : '',
          checkInDate,
          checkOutDate
        });
        setShowNewBookingModal(true);
      };

      if (loading) {
        return (
          <div className="flex flex-col items-center justify-center min-h-screen bg-slate-50">
            <div className="w-12 h-12 border-4 border-teal-600 border-t-transparent rounded-full animate-spin"></div>
            <p className="mt-4 font-bold text-teal-800 text-lg">Đang tải GSHEETS HOME...</p>
            <p className="text-xs text-slate-400">Hệ thống quản lý Homestay & Nghỉ dưỡng v1.0</p>
          </div>
        );
      }

      return (
        <div className="flex min-h-screen bg-[#f8fafc]">
          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className={`fixed bottom-20 right-4 sm:top-5 sm:bottom-auto z-50 px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 text-white text-sm font-semibold transition-all transform animate-bounce ${
              toast.type === 'error' ? 'bg-rose-600' : 'bg-teal-700'
            }`}>
              <span>{toast.message}</span>
            </div>
          )}

          {/* DESKTOP SIDEBAR */}
          <aside className="hidden lg:flex flex-col w-64 bg-white border-r border-slate-200 shrink-0 select-none">
            {/* Logo */}
            <div className="p-5 border-b border-slate-100 flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-600 to-emerald-500 flex items-center justify-center text-white text-xl shadow-md shadow-teal-500/20">
                🏡
              </div>
              <div>
                <h1 className="font-extrabold text-base tracking-tight text-slate-900">GSHEETS HOME</h1>
                <p className="text-[11px] font-medium text-slate-400">Homestay | Nghỉ Dưỡng</p>
              </div>
            </div>

            {/* Menu Items */}
            <div className="flex-1 overflow-y-auto px-3 py-4 space-y-6">
              {/* Group 1: VẬN HÀNH */}
              <div>
                <div className="px-3 mb-2 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">
                  VẬN HÀNH
                </div>
                <nav className="space-y-1">
                  {[
                    { id: 'dashboard', label: 'Tổng quan', icon: '🟢' },
                    { id: 'calendar', label: 'Lịch phòng', icon: '📅' },
                    { id: 'bookings', label: 'Đặt phòng', icon: '📝' },
                    { id: 'housekeeping', label: 'Buồng phòng', icon: '🧹' },
                    { id: 'payments', label: 'Thu tiền', icon: '💵' }
                  ].map(item => (
                    <button
                      key={item.id}
                      onClick={() => setCurrentScreen(item.id)}
                      className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl font-semibold text-xs transition ${
                        currentScreen === item.id
                          ? 'bg-teal-50 text-teal-800 shadow-sm border border-teal-100/60 font-bold'
                          : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'
                      }`}
                    >
                      <span className="flex items-center gap-2.5">
                        <span className="text-base">{item.icon}</span>
                        {item.label}
                      </span>
                      {currentScreen === item.id && <span className="w-1.5 h-1.5 rounded-full bg-teal-600"></span>}
                    </button>
                  ))}
                </nav>
              </div>

              {/* Group 2: KHÁCH & SỐ LIỆU */}
              <div>
                <div className="px-3 mb-2 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">
                  KHÁCH & SỐ LIỆU
                </div>
                <nav className="space-y-1">
                  {[
                    { id: 'customers', label: 'Khách hàng', icon: '👥' },
                    { id: 'reports', label: 'Báo cáo', icon: '📊' }
                  ].map(item => (
                    <button
                      key={item.id}
                      onClick={() => setCurrentScreen(item.id)}
                      className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl font-semibold text-xs transition ${
                        currentScreen === item.id
                          ? 'bg-teal-50 text-teal-800 shadow-sm border border-teal-100/60 font-bold'
                          : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'
                      }`}
                    >
                      <span className="flex items-center gap-2.5">
                        <span className="text-base">{item.icon}</span>
                        {item.label}
                      </span>
                      {currentScreen === item.id && <span className="w-1.5 h-1.5 rounded-full bg-teal-600"></span>}
                    </button>
                  ))}
                </nav>
              </div>

              {/* Group 3: HỆ THỐNG */}
              <div>
                <div className="px-3 mb-2 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">
                  HỆ THỐNG
                </div>
                <nav className="space-y-1">
                  {[
                    { id: 'properties', label: 'Cơ sở & phòng', icon: '🏨' },
                    { id: 'users', label: 'Người dùng', icon: '👤' },
                    { id: 'settings', label: 'Cài đặt', icon: '⚙️' },
                    { id: 'guide', label: 'Hướng dẫn', icon: '❓' }
                  ].map(item => (
                    <button
                      key={item.id}
                      onClick={() => setCurrentScreen(item.id)}
                      className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl font-semibold text-xs transition ${
                        currentScreen === item.id
                          ? 'bg-teal-50 text-teal-800 shadow-sm border border-teal-100/60 font-bold'
                          : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'
                      }`}
                    >
                      <span className="flex items-center gap-2.5">
                        <span className="text-base">{item.icon}</span>
                        {item.label}
                      </span>
                      {currentScreen === item.id && <span className="w-1.5 h-1.5 rounded-full bg-teal-600"></span>}
                    </button>
                  ))}
                </nav>
              </div>
            </div>

            {/* Sidebar Bottom Footer */}
            <div className="p-3 border-t border-slate-100 text-[11px] text-slate-400 flex items-center justify-between">
              <div>
                <div className="font-bold text-slate-700">GSHEETS HOME</div>
                <div>{currentUser?.name || 'Quản trị viên'}</div>
              </div>
              <span className="text-[10px] bg-slate-100 px-2 py-0.5 rounded font-mono font-medium">v1.0</span>
            </div>
          </aside>

          {/* MAIN WRAPPER */}
          <div className="flex-1 flex flex-col min-w-0 pb-16 lg:pb-0">
            {/* TOP HEADER */}
            <header className="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200/80 px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
              {/* Left Title / Breadcrumb */}
              <div className="flex items-center gap-3">
                {/* Mobile hamburger or screen title */}
                <h2 className="font-bold text-base sm:text-lg text-slate-900 capitalize flex items-center gap-2">
                  <span className="lg:hidden text-lg">🏡</span>
                  {currentScreen === 'dashboard' && 'Tổng quan hôm nay'}
                  {currentScreen === 'calendar' && 'Lịch phòng'}
                  {currentScreen === 'bookings' && 'Quản lý Đặt phòng'}
                  {currentScreen === 'housekeeping' && 'Buồng phòng'}
                  {currentScreen === 'payments' && 'Sổ quỹ Thu tiền'}
                  {currentScreen === 'customers' && 'Hồ sơ Khách hàng'}
                  {currentScreen === 'reports' && 'Báo cáo kinh doanh'}
                  {currentScreen === 'properties' && 'Cơ sở & Loại phòng'}
                  {currentScreen === 'users' && 'Người dùng & Phân quyền'}
                  {currentScreen === 'settings' && 'Cài đặt hệ thống'}
                  {currentScreen === 'guide' && 'Hướng dẫn sử dụng'}
                </h2>
              </div>

              {/* Center / Right controls */}
              <div className="flex items-center gap-2 sm:gap-4">
                {/* Global Search Input */}
                <div className="relative hidden md:block w-64 lg:w-72">
                  <span className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 text-sm">
                    🔍
                  </span>
                  <input
                    type="text"
                    value={globalSearch}
                    onChange={(e) => setGlobalSearch(e.target.value)}
                    placeholder="Tìm đơn, khách, phòng... (Ctrl+K)"
                    className="w-full pl-9 pr-4 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200/80 focus:bg-white text-xs border border-transparent focus:border-teal-500 focus:outline-none transition"
                  />
                  {globalSearch && (
                    <button
                      onClick={() => setGlobalSearch('')}
                      className="absolute inset-y-0 right-0 pr-3 flex items-center text-xs text-slate-400"
                    >
                      ✕
                    </button>
                  )}
                </div>

                {/* Google Sheets Sync Button */}
                <button
                  onClick={handleSyncGoogleSheets}
                  disabled={syncingGSheets}
                  className="p-2 sm:px-3 sm:py-1.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-semibold border border-emerald-200/80 flex items-center gap-1.5 transition active:scale-95"
                  title="Đồng bộ ngay sang Google Sheets"
                >
                  <span className={syncingGSheets ? 'animate-spin' : ''}>🔄</span>
                  <span className="hidden sm:inline">Google Sheets</span>
                </button>

                {/* Notification Bell */}
                <div className="relative">
                  <button className="p-2 rounded-xl text-slate-500 hover:bg-slate-100 relative">
                    🔔
                    <span className="absolute top-1 right-1 px-1.5 py-0.2 bg-rose-500 text-white font-bold rounded-full text-[9px]">
                      35
                    </span>
                  </button>
                </div>

                {/* User Dropdown */}
                <div className="relative">
                  <button
                    onClick={() => setUserMenuOpen(!userMenuOpen)}
                    className="flex items-center gap-2 pl-2 pr-3 py-1.5 rounded-xl hover:bg-slate-100 transition border border-transparent hover:border-slate-200"
                  >
                    <div className="w-8 h-8 rounded-full bg-teal-700 text-white font-bold text-xs flex items-center justify-center uppercase shadow-sm">
                      {currentUser?.name ? currentUser.name.slice(0, 2) : 'TV'}
                    </div>
                    <div className="hidden sm:block text-left text-xs">
                      <div className="font-bold text-slate-800 leading-tight">{currentUser?.name}</div>
                      <div className="text-[10px] text-slate-400">{currentUser?.roleLabel}</div>
                    </div>
                    <span className="text-[10px] text-slate-400">▼</span>
                  </button>

                  {/* Dropdown Menu */}
                  {userMenuOpen && (
                    <div className="absolute right-0 mt-2 w-56 bg-white rounded-2xl shadow-2xl border border-slate-100 py-2 z-50 text-xs">
                      <div className="px-4 py-2 border-b border-slate-100">
                        <div className="font-bold text-slate-900">{currentUser?.name}</div>
                        <div className="text-slate-400 text-[11px]">{currentUser?.username} · {currentUser?.roleLabel}</div>
                        <div className="text-[10px] text-teal-600 mt-1">Phạm vi: {currentUser?.propertyScopeLabel}</div>
                      </div>

                      <div className="px-3 py-2 text-[10px] font-bold uppercase text-slate-400">
                        Chuyển ca / Đổi người dùng
                      </div>
                      {(data.users || []).map(u => (
                        <button
                          key={u.id}
                          onClick={() => handleSwitchUser(u)}
                          className={`w-full text-left px-4 py-2 flex items-center justify-between hover:bg-slate-50 transition ${
                            currentUser?.id === u.id ? 'font-bold text-teal-700 bg-teal-50/50' : 'text-slate-700'
                          }`}
                        >
                          <span>{u.name} ({u.roleLabel})</span>
                          {currentUser?.id === u.id && <span>✓</span>}
                        </button>
                      ))}

                      <div className="border-t border-slate-100 my-1"></div>
                      <button
                        onClick={() => { setUserMenuOpen(false); setCurrentScreen('settings'); }}
                        className="w-full text-left px-4 py-2 hover:bg-slate-50 text-slate-700 flex items-center gap-2"
                      >
                        ⚙️ Cài đặt hệ thống
                      </button>
                      <button
                        onClick={() => { setUserMenuOpen(false); setShowLoginModal(true); }}
                        className="w-full text-left px-4 py-2 hover:bg-rose-50 text-rose-600 font-semibold flex items-center gap-2"
                      >
                        🚪 Đăng xuất / Đổi mật khẩu
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </header>

            {/* SCREEN CONTENT ROUTER */}
            <main className="flex-1 p-4 sm:p-6 overflow-x-hidden">
              {/* Property Selector Header (For views with property filter) */}
              {['dashboard', 'calendar', 'housekeeping', 'bookings'].includes(currentScreen) && (
                <div className="mb-5 flex flex-wrap items-center justify-between gap-3">
                  {/* Property filter tabs */}
                  <div className="flex items-center gap-1.5 p-1 bg-white border border-slate-200/80 rounded-2xl shadow-sm overflow-x-auto max-w-full">
                    <button
                      onClick={() => setSelectedPropertyFilter('all')}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap ${
                        selectedPropertyFilter === 'all'
                          ? 'bg-teal-700 text-white shadow-sm'
                          : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                      }`}
                    >
                      🏨 Tất cả cơ sở
                    </button>
                    {userAllowedProperties.map(p => (
                      <button
                        key={p.id}
                        onClick={() => setSelectedPropertyFilter(p.id)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap ${
                          selectedPropertyFilter === p.id
                            ? 'bg-teal-700 text-white shadow-sm'
                            : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                        }`}
                      >
                        {p.name}
                      </button>
                    ))}
                  </div>

                  {/* Quick Action Buttons */}
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => { setBookingModalInitialData(null); setShowNewBookingModal(true); }}

    // ========================================================
    // SCREEN 2: LỊCH PHÒNG (TIMELINE / GANTT VIEW DESKTOP/MOBILE)
    // ========================================================
    function CalendarTimelineScreen({ data, filteredRooms, filteredBookings, onSelectRange, onViewBooking }) {
      const [viewDays, setViewDays] = useState(14); // 7, 14, 30
      const [startDateOffset, setStartDateOffset] = useState(0); // days from 2026-11-12
      const baseDate = new Date('2026-11-12');

      // Generate date array
      const timelineDates = useMemo(() => {
        const dates = [];
        const start = new Date(baseDate);
        start.setDate(start.getDate() + startDateOffset);
        const dayNames = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];

        for (let i = 0; i < viewDays; i++) {
          const d = new Date(start);
          d.setDate(d.getDate() + i);
          const yyyy = d.getFullYear();
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          const dateStr = `${yyyy}-${mm}-${dd}`;
          const isToday = (dd === '13' && mm === '11');

          dates.push({
            dateStr,
            day: dd,
            month: mm,
            dayOfWeek: dayNames[d.getDay()],
            isToday,
            isWeekend: (d.getDay() === 5 || d.getDay() === 6) // Fri/Sat
          });
        }
        return dates;
      }, [baseDate, startDateOffset, viewDays]);

      // Group rooms by property
      const roomsByProperty = useMemo(() => {
        const map = {};
        (filteredRooms || []).forEach(r => {
          if (!map[r.propertyId]) map[r.propertyId] = [];
          map[r.propertyId].push(r);
        });
        return map;
      }, [filteredRooms]);

      // Drag / Selection state
      const [selection, setSelection] = useState(null); // { roomId, startCol, endCol }

      const handleCellClick = (room, dateItem) => {
        if (room.housekeepingStatus === 'maintenance') {
          alert(`Phòng ${room.name} đang bảo trì (${room.maintenanceReason || 'Đang sửa chữa'}), không thể đặt!`);
          return;
        }
        // Open fast booking range: 2 nights default
        const nextDate = new Date(dateItem.dateStr);
        nextDate.setDate(nextDate.getDate() + 2);
        const nextDateStr = nextDate.toISOString().split('T')[0];
        onSelectRange(room.id, dateItem.dateStr, nextDateStr);
      };

      return (
        <div className="bg-white rounded-3xl border border-slate-200/80 shadow-sm overflow-hidden flex flex-col">
          {/* Calendar Toolbar */}
          <div className="p-4 sm:p-5 border-b border-slate-100 flex flex-wrap items-center justify-between gap-4">
            {/* Left Nav */}
            <div className="flex items-center gap-2">
              <button
                onClick={() => setStartDateOffset(o => o - 7)}
                className="w-8 h-8 rounded-xl border border-slate-200 flex items-center justify-center hover:bg-slate-50 text-slate-600 font-bold"
              >
                ‹
              </button>
              <button
                onClick={() => setStartDateOffset(0)}
                className="px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-700 hover:bg-slate-50"
              >
                Hôm nay
              </button>
              <button
                onClick={() => setStartDateOffset(o => o + 7)}
                className="w-8 h-8 rounded-xl border border-slate-200 flex items-center justify-center hover:bg-slate-50 text-slate-600 font-bold"
              >
                ›
              </button>
              <span className="text-xs font-bold text-slate-800 ml-2">
                📅 {timelineDates[0]?.day}/{timelineDates[0]?.month} - {timelineDates[timelineDates.length - 1]?.day}/{timelineDates[timelineDates.length - 1]?.month}/2026
              </span>
            </div>

            {/* Right: View Mode & Legend */}
            <div className="flex flex-wrap items-center gap-3">
              {/* Day presets */}
              <div className="flex p-1 bg-slate-100 rounded-xl text-xs font-bold">
                {[7, 14, 30].map(days => (
                  <button
                    key={days}
                    onClick={() => setViewDays(days)}
                    className={`px-3 py-1 rounded-lg transition ${viewDays === days ? 'bg-white text-teal-800 shadow-sm' : 'text-slate-500'}`}
                  >
                    {days} ngày
                  </button>
                ))}
              </div>

              {/* Status Legend */}
              <div className="hidden xl:flex items-center gap-3 text-xs font-medium text-slate-600">
                <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-amber-400"></span> Giữ chỗ</span>
                <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-sky-500"></span> Đã xác nhận</span>
                <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Đang ở</span>
                <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-slate-400"></span> Đã trả phòng</span>
                <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-rose-600"></span> Còn nợ</span>
              </div>
            </div>
          </div>

          <div className="px-5 py-2 bg-amber-50/50 border-b border-amber-100/60 text-[11px] text-amber-800 flex items-center justify-between">
            <span>💡 <b>Mẹo thao tác:</b> Bấm hoặc kéo chuột trên các ô ngày trống để mở ngay form <b>Đặt phòng mới</b> với phòng & ngày tự điền. Bấm vào thanh màu để xem chi tiết / nhận / trả phòng.</span>
          </div>

          {/* Timeline Table Container */}
          <div className="overflow-x-auto relative">
            <table className="w-full border-collapse text-xs select-none">
              {/* Header: Dates */}
              <thead>
                <tr className="bg-slate-50/90 border-b border-slate-200">
                  <th className="sticky left-0 z-20 bg-slate-100 p-3 text-left font-extrabold text-slate-700 w-44 min-w-[176px] border-r border-slate-200">
                    PHÒNG
                  </th>
                  {timelineDates.map(d => (
                    <th
                      key={d.dateStr}
                      className={`p-2 text-center border-r border-slate-200 min-w-[65px] ${
                        d.isToday ? 'bg-teal-50 text-teal-800' : d.isWeekend ? 'bg-slate-100/50' : ''
                      }`}
                    >
                      <div className="text-[10px] text-slate-400 uppercase font-bold">{d.dayOfWeek}</div>
                      <div className={`text-sm font-extrabold mt-0.5 inline-block px-1.5 py-0.2 rounded-full ${
                        d.isToday ? 'bg-teal-700 text-white' : 'text-slate-800'
                      }`}>
                        {d.day}
                      </div>
                      <div className="text-[9px] text-slate-400">th{d.month}</div>
                    </th>
                  ))}
                </tr>
              </thead>

              {/* Rows grouped by Property */}
              <tbody>
                {Object.entries(roomsByProperty).map(([propId, pRooms]) => {
                  const prop = (data.properties || []).find(p => p.id === propId) || { name: 'Cơ sở' };
                  return (
                    <React.Fragment key={propId}>
                      {/* Property Header Row */}
                      <tr className="bg-teal-50/80 border-b border-teal-100 font-bold text-teal-900">
                        <td className="sticky left-0 z-10 bg-teal-50/90 p-2.5 px-3 border-r border-teal-200">
                          🏨 {prop.name} ({pRooms.length} phòng)
                        </td>
                        {timelineDates.map(d => (
                          <td key={d.dateStr} className="p-1 text-center border-r border-teal-100 text-[10px] text-teal-700">
                            {/* Empty rooms count simulation */}
                            {Math.max(1, pRooms.length - 2)}
                          </td>
                        ))}
                      </tr>

                      {/* Room Rows */}
                      {pRooms.map(room => {
                        const roomType = (data.roomTypes || []).find(rt => rt.id === room.roomTypeId) || {};
                        const isMaintenance = room.housekeepingStatus === 'maintenance';

                        // Find bookings for this room that intersect timeline
                        const roomBookings = filteredBookings.filter(b => b.roomId === room.id);

                        return (
                          <tr key={room.id} className="border-b border-slate-100 hover:bg-slate-50/40 relative h-12">
                            {/* Room Info Cell */}
                            <td className="sticky left-0 z-10 bg-white p-2.5 px-3 border-r border-slate-200 flex items-center justify-between">
                              <div>
                                <span className="font-extrabold text-sm text-slate-900">{room.name}</span>
                                <div className="text-[10px] text-slate-400 leading-tight">{roomType.name || ''}</div>
                              </div>
                              {isMaintenance && (
                                <span className="text-xs text-rose-500 font-bold" title={room.maintenanceReason || 'Bảo trì'}>
                                  🛠️
                                </span>
                              )}
                            </td>

                            {/* Date Cells */}
                            {timelineDates.map(d => {
                              // Check if any booking covers this day
                              const booking = roomBookings.find(b => d.dateStr >= b.checkInDate && d.dateStr < b.checkOutDate);

                              return (
                                <td
                                  key={d.dateStr}
                                  onClick={() => handleCellClick(room, d)}
                                  className={`p-1 border-r border-slate-100 relative cursor-pointer hover:bg-teal-50/30 ${
                                    isMaintenance ? 'bg-striped-diagonal cursor-not-allowed' : ''
                                  } ${d.isToday ? 'bg-teal-50/20' : ''}`}
                                >
                                  {/* Render Booking Bar Segment */}
                                  {booking && (
                                    <div
                                      onClick={(e) => {
                                        e.stopPropagation();
                                        onViewBooking(booking);
                                      }}
                                      className={`booking-bar w-full h-8 rounded-lg px-2 flex items-center justify-between text-[11px] font-bold text-white shadow-sm overflow-hidden ${
                                        booking.status === 'in_house' ? 'bg-emerald-600' :
                                        booking.status === 'hold' ? 'bg-amber-500' :
                                        booking.status === 'checked_out' ? 'bg-slate-400' : 'bg-sky-600'
                                      }`}
                                      title={`${booking.customerName} (${booking.checkInDate} - ${booking.checkOutDate})`}
                                    >
                                      <span className="truncate">{booking.customerName}</span>
                                      {booking.balance > 0 && (
                                        <span className="w-2 h-2 rounded-full bg-rose-500 shrink-0 ml-1" title={`Còn nợ: ${formatVND(booking.balance)}`}></span>
                                      )}
                                    </div>
                                  )}
                                </td>
                              );
                            })}
                          </tr>
                        );
                      })}
                    </React.Fragment>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ==========================================
    // SCREEN 4: HOUSEKEEPING (BUỒNG PHÒNG 6 MÀU)
    // ==========================================
    function HousekeepingScreen({ data, rooms, onCleanAll, onRefresh, showToast }) {
      const [filterStatus, setFilterStatus] = useState('all');

      // Status counters
      const counts = useMemo(() => {
        const c = { occupied: 0, due_out: 0, arriving: 0, clean: 0, dirty: 0, maintenance: 0 };
        (rooms || []).forEach(r => {
          if (c[r.housekeepingStatus] !== undefined) c[r.housekeepingStatus]++;
        });
        return c;
      }, [rooms]);

      const handleUpdateStatus = async (roomId, newStatus) => {
        try {
          const res = await fetch(`/api/rooms/${roomId}/housekeeping`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: newStatus })
          });
          if (res.ok) {
            showToast('✅ Đã cập nhật trạng thái phòng!');
            onRefresh();
          }
        } catch (e) {
          showToast('Lỗi: ' + e.message, 'error');
        }
      };

      // Group rooms by Property
      const roomsByProp = useMemo(() => {
        const map = {};
        (rooms || []).forEach(r => {
          if (filterStatus !== 'all' && r.housekeepingStatus !== filterStatus) return;
          if (!map[r.propertyId]) map[r.propertyId] = [];
          map[r.propertyId].push(r);
        });
        return map;
      }, [rooms, filterStatus]);

      return (
        <div className="space-y-6">
          {/* Header & 6 Status Badges - Exact match Screenshot 9 */}
          <div className="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200/80 shadow-sm space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <div>
                <h3 className="font-extrabold text-xl text-slate-900">Buồng phòng</h3>
                <p className="text-xs text-slate-500">Tình trạng phòng hôm nay — bấm vào phòng để nhận / trả phòng hoặc đánh dấu đã dọn</p>
              </div>

              <button
                onClick={onCleanAll}
                className="px-4 py-2.5 rounded-xl bg-teal-700 hover:bg-teal-800 text-white font-bold text-xs shadow-md shadow-teal-700/20 flex items-center gap-2 transition active:scale-95"
              >
                <span>🧹 Đã dọn tất cả</span>
              </button>
            </div>

            {/* 6 Color-coded Badges */}
            <div className="flex flex-wrap gap-2 pt-2">
              {[
                { id: 'occupied', label: 'Đang ở', count: counts.occupied, colorClass: 'bg-sky-100 text-sky-800 border-sky-300' },
                { id: 'due_out', label: 'Đến hạn trả', count: counts.due_out, colorClass: 'bg-rose-100 text-rose-800 border-rose-300' },
                { id: 'arriving', label: 'Khách đến hôm nay', count: counts.arriving, colorClass: 'bg-purple-100 text-purple-800 border-purple-300' },
                { id: 'clean', label: 'Trống – sẵn sàng', count: counts.clean, colorClass: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
                { id: 'dirty', label: 'Trống – chưa dọn', count: counts.dirty, colorClass: 'bg-amber-100 text-amber-800 border-amber-300' },
                { id: 'maintenance', label: 'Bảo trì', count: counts.maintenance, colorClass: 'bg-slate-200 text-slate-800 border-slate-300' }
              ].map(badge => (
                <button
                  key={badge.id}

    // ==========================================
    function PaymentsScreen({ data, onOpenNewPayment, showToast }) {
      const payments = data.payments || [];

      // Calculate totals
      const totals = useMemo(() => {
        let totalThu = 0;
        let daHoanTien = 0;
        payments.forEach(p => {
          if (p.amount > 0) totalThu += p.amount;
          else daHoanTien += Math.abs(p.amount);
        });
        const thucThu = totalThu - daHoanTien;
        return { totalThu, daHoanTien, thucThu };
      }, [payments]);

      const handleExportExcel = () => {
        window.open('/api/export/payments', '_blank');
        showToast('📥 Đang tải file Excel danh sách phiếu thu...');

                <span className="w-2 h-2 rounded-full bg-emerald-500"></span> Tổng thu

                <div className="text-2xl sm:text-3xl font-black text-slate-900">{formatVND(totals.totalThu)}</div>

    // MODAL 1: NEW SINGLE BOOKING
    // ==========================================
    function NewBookingModal({ data, initialData, onClose, onSuccess }) {
      const [propertyId, setPropertyId] = useState(initialData?.propertyId || data.properties[0]?.id || '');
      const [roomId, setRoomId] = useState(initialData?.roomId || '');
      const [customerName, setCustomerName] = useState('');
      const [customerPhone, setCustomerPhone] = useState('');
      const [checkInDate, setCheckInDate] = useState(initialData?.checkInDate || '2026-11-13');
      const [checkOutDate, setCheckOutDate] = useState(initialData?.checkOutDate || '2026-11-15');
      const [guestsCount, setGuestsCount] = useState(2);
      const [source, setSource] = useState('direct');
      const [status, setStatus] = useState('confirmed');
      const [deposit, setDeposit] = useState(0);
      const [paymentMethod, setPaymentMethod] = useState('cash');
      const [notes, setNotes] = useState('');
      const [submitting, setSubmitting] = useState(false);

      // Selected room & room type
      const currentRoom = (data.rooms || []).find(r => r.id === roomId);
      const currentRoomType = (data.roomTypes || []).find(rt => rt.id === currentRoom?.roomTypeId);

      // Available rooms in selected property
      const propRooms = (data.rooms || []).filter(r => r.propertyId === propertyId);

      // Set initial room if empty
      useEffect(() => {
        if (!roomId && propRooms.length) {
          setRoomId(propRooms[0].id);
        }
      }, [propertyId]);

      // Computed rates
      const computedRates = useMemo(() => {
        if (!currentRoomType || !checkInDate || !checkOutDate) return [];
        const weekendNights = data.settings?.weekendNights || ['fri', 'sat'];
        const start = new Date(checkInDate);
        const end = new Date(checkOutDate);
        const dayNames = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
        const dayCodes = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
        const rates = [];

        let cur = new Date(start);
        while (cur < end) {
          const code = dayCodes[cur.getDay()];
          const isWeekend = weekendNights.includes(code);
          const rate = isWeekend ? (currentRoomType.priceWeekend || currentRoomType.priceWeekday) : currentRoomType.priceWeekday;
          rates.push({
            date: cur.toISOString().split('T')[0],
            dayName: dayNames[cur.getDay()],
            isWeekend,
            rate
          });
          cur.setDate(cur.getDate() + 1);
        }
        return rates;
      }, [currentRoomType, checkInDate, checkOutDate, data]);

      const roomTotal = computedRates.reduce((s, r) => s + r.rate, 0);

      const handleSubmit = async (e) => {
        e.preventDefault();

            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              propertyId,
              roomId,
              customerName,
              customerPhone,
              checkInDate,
              checkOutDate,
              guestsCount: Number(guestsCount),
              source,
              status,
              deposit: Number(deposit) || 0,
              paymentMethod,
              notes

        if (selectedRoomIds.includes(rId)) {

          setSelectedRoomIds([...selectedRoomIds, rId]);

        e.preventDefault();
        if (!selectedRoomIds.length) {
          alert('Vui lòng chọn ít nhất 1 phòng');

        setSubmitting(true);
        try {
          const res = await fetch('/api/bookings/group', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              groupName,
              customerName,
              customerPhone,
              checkInDate,
              checkOutDate,
              rooms: selectedRoomIds.map(id => ({ roomId: id })),
              depositTotal: Number(depositTotal) || 0,
              paymentMethod,
              notes
            })
          });
          if (res.ok) {
            onSuccess();
          } else {
            const err = await res.json();
            alert('Lỗi: ' + err.error);
          }

          alert('Lỗi kết nối: ' + e.message);
        } finally {
          setSubmitting(false);

                <div>
                  <label className="font-bold text-slate-700 block mb-1">Số điện thoại *</label>

                    type="tel"
                    required
                    placeholder="09xxxxxxxx"

                    onChange={(e) => setCustomerPhone(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200"
                  />

              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Ngày nhận phòng</label>

                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200"
                  />
                </div>
              </div>

              {/* Multi-room selection */}
              <div>
                <label className="font-bold text-slate-700 block mb-1">
                  Chọn các phòng cho đoàn ({selectedRoomIds.length} phòng đã chọn):
                </label>
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-48 overflow-y-auto p-2 rounded-2xl bg-slate-50 border border-slate-200">

                    return (
                      <button
                        type="button"
                        key={r.id}

                        className={`p-2 rounded-xl border text-left transition flex items-center justify-between ${

                        <span>{isSelected ? '✓' : '＋'}</span>

                      <option key={m.id} value={m.id}>{m.name}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2.5 rounded-xl bg-slate-100 font-bold text-slate-600"
                >
                  Hủy
                </button>
                <button
                  type="submit"
                  disabled={submitting}
                  className="px-5 py-2.5 rounded-xl bg-teal-700 hover:bg-teal-800 text-white font-bold shadow-md shadow-teal-700/20"

                  {submitting ? 'Đang tạo đoàn...' : '🚀 Tạo Đơn Đoàn'}

          </div>
        </div>
      );

    // ==========================================
    // MODAL 5: PAYMENT MODAL
    // ==========================================
    function PaymentModal({ data, initialBooking, onClose, onSuccess }) {
      const [bookingId, setBookingId] = useState(initialBooking?.id || '');
      const [amount, setAmount] = useState(initialBooking ? initialBooking.balance : 0);
      const [type, setType] = useState('payment'); // payment, deposit, refund
      const [method, setMethod] = useState('cash');
      const [notes, setNotes] = useState('');
      const [submitting, setSubmitting] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSubmitting(true);
        try {
          const res = await fetch('/api/payments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              bookingId,
              amount: Number(amount),
              type,
              method,
              notes
            })
          });
          if (res.ok) {
            onSuccess();
          } else {
            alert('Lỗi tạo phiếu thu');
          }
        } catch (e) {
          alert('Lỗi kết nối: ' + e.message);
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 text-xs">
            <div className="flex items-center justify-between pb-3 border-b border-slate-100">
              <h3 className="font-extrabold text-base text-slate-900">💵 Lập Phiếu Thu / Chi Tiền</h3>
              <button onClick={onClose} className="p-1 rounded-xl hover:bg-slate-100 text-slate-400">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3">
              <div>
                <label className="font-bold text-slate-700 block mb-1">Mã đặt phòng liên quan</label>
                <select
                  value={bookingId}
                  onChange={(e) => {
                    setBookingId(e.target.value);
                    const b = (data.bookings || []).find(x => x.id === e.target.value);
                    if (b) setAmount(b.balance);
                  }}
                  className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200"
                >
                  <option value="">Thu ngoài / Không gắn đơn</option>
                  {(data.bookings || []).map(b => (
                    <option key={b.id} value={b.id}>{b.id} - {b.customerName} ({b.roomName})</option>
                  ))}
                </select>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Loại giao dịch</label>
                  <select
                    value={type}
                    onChange={(e) => setType(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 font-bold"
                  >
                    <option value="payment">Thanh toán</option>
                    <option value="deposit">Đặt cọc</option>
                    <option value="refund">Hoàn tiền</option>
                  </select>
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Phương thức</label>
                  <select
                    value={method}
                    onChange={(e) => setMethod(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200"
                  >
                    {(data.categories?.paymentMethods || []).map(m => (
                      <option key={m.id} value={m.id}>{m.name}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div>
                <label className="font-bold text-slate-700 block mb-1">Số tiền (VNĐ) *</label>
                <input
                  type="number"
                  required
                  value={amount}
                  onChange={(e) => setAmount(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 font-black text-sm text-teal-800"
                />
              </div>

              <div>
                <label className="font-bold text-slate-700 block mb-1">Ghi chú</label>
                <input
                  type="text"
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  placeholder="Lý do thu / chuyển khoản số..."
                  className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200"
                />
              </div>

              <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl bg-slate-100 font-bold text-slate-600">Hủy</button>
                <button type="submit" disabled={submitting} className="px-5 py-2 rounded-xl bg-teal-700 text-white font-bold shadow-md">
                  {submitting ? 'Đang lưu...' : 'Lưu Phiếu'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // MODAL 6: CUSTOMER MODAL
    // ==========================================

      const [phone, setPhone] = useState('');

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 text-xs">
            <div className="flex items-center justify-between pb-3 border-b border-slate-100">
              <h3 className="font-extrabold text-base text-slate-900">👤 Thêm Hồ Sơ Khách Hàng</h3>

              <div>
                <label className="font-bold text-slate-700 block mb-1">Họ và tên *</label>
                <input
                  type="text"

                  value={name}

                  className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200"
                />
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Số điện thoại *</label>
                  <input
                    type="tel"
                    required
                    value={phone}
                    onChange={(e) => setPhone(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200"
                  />
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">CCCD / Hộ chiếu</label>

                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200"
                  >
                    <option value="regular">Thường</option>
                    <option value="loyal">Thân thiết</option>
                    <option value="vip">👑 VIP</option>

              <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">

                <button type="submit" disabled={submitting} className="px-5 py-2 rounded-xl bg-teal-700 text-white font-bold shadow-md">

    // ==========================================
    // MODAL 7: USER & PERMISSION MATRIX MODAL
    // Exact match Screenshot 4
    // ==========================================
    function UserModal({ data, onClose, onSuccess }) {
      const [name, setName] = useState('');
      const [username, setUsername] = useState('');
      const [phone, setPhone] = useState('');
      const [email, setEmail] = useState('');
      const [role, setRole] = useState('user');
      const [roleLabel, setRoleLabel] = useState('Lễ tân');
      const [propertyScope, setPropertyScope] = useState('all');
      const [permissions, setPermissions] = useState({
        booking: { view: true, add: true, edit: true, delete: false },
        payment: { view: true, add: true, edit: false, delete: false },
        housekeeping: { view: true, add: false, edit: true, delete: false },
        customer: { view: true, add: true, edit: true, delete: false },
        reports: { view: false, add: false, edit: false, delete: false },
        property: { view: true, add: false, edit: false, delete: false },
        settings: { view: false, add: false, edit: false, delete: false }
      });
      const [submitting, setSubmitting] = useState(false);

      const applyPreset = (preset) => {
        if (preset === 'admin') {
          setRole('admin');
          setRoleLabel('Quản trị viên');
          setPropertyScope('all');
          const p = {};
          ['booking', 'payment', 'housekeeping', 'customer', 'reports', 'property', 'settings'].forEach(k => {
            p[k] = { view: true, add: true, edit: true, delete: true };
          });
          setPermissions(p);
        } else if (preset === 'letan') {
          setRole('user');
          setRoleLabel('Lễ tân');
          setPermissions({
            booking: { view: true, add: true, edit: true, delete: false },
            payment: { view: true, add: true, edit: false, delete: false },
            housekeeping: { view: true, add: false, edit: true, delete: false },
            customer: { view: true, add: true, edit: true, delete: false },
            reports: { view: false, add: false, edit: false, delete: false },
            property: { view: true, add: false, edit: false, delete: false },
            settings: { view: false, add: false, edit: false, delete: false }
          });
        } else if (preset === 'ketoan') {
          setRole('user');
          setRoleLabel('Kế toán');
          setPermissions({
            booking: { view: true, add: false, edit: false, delete: false },
            payment: { view: true, add: true, edit: true, delete: true },
            housekeeping: { view: false, add: false, edit: false, delete: false },
            customer: { view: true, add: false, edit: false, delete: false },
            reports: { view: true, add: false, edit: false, delete: false },
            property: { view: true, add: false, edit: false, delete: false },
            settings: { view: false, add: false, edit: false, delete: false }
          });
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSubmitting(true);
        try {
          const res = await fetch('/api/users', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name,
              username,
              phone,
              email,
              role,
              roleLabel,
              propertyScope,
              propertyScopeLabel: propertyScope === 'all' ? 'Tất cả' : (data.properties.find(p => p.id === propertyScope)?.name || 'Cơ sở'),
              permissionsSummary: 'Theo ma trận quyền',
              permissions
            })
          });
          if (res.ok) onSuccess();
        } catch (e) {
          alert('Lỗi: ' + e.message);
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl space-y-4 text-xs my-8">
            <div className="flex items-center justify-between pb-3 border-b border-slate-100">
              <h3 className="font-extrabold text-base text-slate-900">👤 Sửa / Thêm Người Dùng & Phân Quyền</h3>
              <button onClick={onClose} className="p-1 rounded-xl hover:bg-slate-100 text-slate-400">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Họ tên *</label>
                  <input
                    type="text"
                    required
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200"
                  />
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Tài khoản đăng nhập *</label>
                  <input
                    type="text"
                    required
                    value={username}
                    onChange={(e) => setUsername(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 font-mono"
                  />
                </div>
              </div>

              {/* Phạm vi cơ sở */}
              <div>
                <label className="font-bold text-slate-700 block mb-1">Phạm vi cơ sở (Giới hạn lễ tân chỉ thấy cơ sở được giao):</label>
                <div className="flex flex-wrap gap-2">
                  <button
                    type="button"
                    onClick={() => setPropertyScope('all')}
                    className={`px-3 py-1.5 rounded-xl border font-bold ${propertyScope === 'all' ? 'bg-teal-700 text-white' : 'bg-slate-50 text-slate-700'}`}
                  >
                    Tất cả cơ sở
                  </button>
                  {(data.properties || []).map(p => (
                    <button
                      type="button"
                      key={p.id}
                      onClick={() => setPropertyScope(p.id)}
                      className={`px-3 py-1.5 rounded-xl border font-bold ${propertyScope === p.id ? 'bg-teal-700 text-white' : 'bg-slate-50 text-slate-700'}`}
                    >
                      {p.name}
                    </button>
                  ))}
                </div>
              </div>

              {/* Ma trận quyền */}
              <div className="pt-2 border-t border-slate-100">
                <div className="flex items-center justify-between mb-2">
                  <label className="font-bold text-slate-800">Ma trận quyền hạn</label>
                  <div className="flex gap-1">
                    <button type="button" onClick={() => applyPreset('letan')} className="px-2 py-0.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-[10px]">
                      Preset Lễ tân
                    </button>
                    <button type="button" onClick={() => applyPreset('ketoan')} className="px-2 py-0.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-[10px]">
                      Preset Kế toán
                    </button>
                    <button type="button" onClick={() => applyPreset('admin')} className="px-2 py-0.5 rounded bg-teal-100 text-teal-800 font-semibold text-[10px]">
                      Toàn quyền
                    </button>
                  </div>
                </div>

                <div className="border border-slate-200 rounded-2xl overflow-hidden">
                  <table className="w-full text-[11px] text-left">
                    <thead className="bg-slate-50 border-b border-slate-200 font-bold text-slate-600">
                      <tr>
                        <th className="p-2.5">Chức năng</th>
                        <th className="p-2.5 text-center">Xem</th>
                        <th className="p-2.5 text-center">Thêm</th>
                        <th className="p-2.5 text-center">Sửa</th>
                        <th className="p-2.5 text-center">Xóa</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 font-medium">
                      {[
                        { id: 'booking', label: 'Đặt phòng & lịch phòng' },
                        { id: 'payment', label: 'Thu tiền' },
                        { id: 'housekeeping', label: 'Buồng phòng' },
                        { id: 'customer', label: 'Khách hàng' },
                        { id: 'reports', label: 'Báo cáo' },
                        { id: 'property', label: 'Cơ sở & phòng' },
                        { id: 'settings', label: 'Cài đặt' }
                      ].map(item => {
                        const cur = permissions[item.id] || { view: false, add: false, edit: false, delete: false };
                        return (
                          <tr key={item.id} className="hover:bg-slate-50/50">
                            <td className="p-2.5 font-bold text-slate-800">{item.label}</td>
                            {['view', 'add', 'edit', 'delete'].map(action => (
                              <td key={action} className="p-2.5 text-center">
                                <input
                                  type="checkbox"
                                  checked={!!cur[action]}
                                  onChange={(e) => {
                                    setPermissions({
                                      ...permissions,
                                      [item.id]: { ...cur, [action]: e.target.checked }
                                    });
                                  }}
                                  className="w-4 h-4 rounded text-teal-700"
                                />
                              </td>
                            ))}
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>

              <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl bg-slate-100 font-bold text-slate-600">Đóng</button>
                <button type="submit" disabled={submitting} className="px-5 py-2 rounded-xl bg-teal-700 text-white font-bold shadow-md">
                  Lưu Người Dùng
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // MODAL 8: LOGIN SCREEN (GIAO DIỆN ĐĂNG NHẬP)
    // Exact match Screenshot 1
    // ==========================================
    function LoginModal({ data, onClose, onLoginSuccess }) {
      const [username, setUsername] = useState('admin');
      const [password, setPassword] = useState('123');
      const [error, setError] = useState('');

      const handleLogin = async (e) => {
        e.preventDefault();
        setError('');
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const json = await res.json();
          if (res.ok) {
            onLoginSuccess(json.user);
          } else {
            setError(json.error || 'Đăng nhập không thành công');
          }
        } catch (err) {
          setError(err.message);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-sm w-full p-8 shadow-2xl space-y-6 text-center">
            <div>
              <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-teal-600 to-emerald-500 text-white text-3xl flex items-center justify-center mx-auto shadow-lg shadow-teal-500/25 mb-3">
                🏡
              </div>
              <h3 className="font-extrabold text-2xl text-slate-900">Đăng nhập</h3>
              <p className="text-xs text-slate-400 mt-1">Chào mừng bạn quay lại ca làm việc</p>
            </div>

            {error && (
              <div className="p-3 rounded-xl bg-rose-50 text-rose-700 text-xs font-bold">
                {error}
              </div>
            )}

            <form onSubmit={handleLogin} className="space-y-4 text-left text-xs">
              <div>
                <label className="font-bold text-slate-600 block mb-1">Tài khoản</label>
                <input
                  type="text"
                  required
                  value={username}
                  onChange={(e) => setUsername(e.target.value)}
                  placeholder="admin"
                  className="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 font-medium"
                />
              </div>

              <div>
                <label className="font-bold text-slate-600 block mb-1">Mật khẩu</label>
                <input
                  type="password"
                  required
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  placeholder="••••••"
                  className="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 font-medium"
                />
              </div>

              <button
                type="submit"
                className="w-full py-3.5 rounded-xl bg-gradient-to-r from-teal-700 to-emerald-600 hover:from-teal-800 hover:to-emerald-700 text-white font-extrabold text-sm shadow-lg shadow-teal-700/25 transition active:scale-95 flex items-center justify-center gap-2"
              >
                <span>➜] Đăng nhập</span>
              </button>
            </form>

            <div className="pt-2 border-t border-slate-100">
              <span className="text-[11px] text-slate-400 font-mono">Version 1.0 · GSHEETS HOME</span>
            </div>
          </div>
        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
