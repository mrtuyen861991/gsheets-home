<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GSHEETS HOME - Quản lý Homestay & Nghỉ Dưỡng</title>
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2038/2038136.png" />
  
  <!-- Google Fonts: Montserrat (Full Weights 300-900 with Vietnamese subset) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS: Local vendor first, then fallback to CDN -->
  <script src="/vendor/tailwindcss.js"></script>
  <script>
    if (!window.tailwind) {
      document.write('<script src="https://cdn.tailwindcss.com"><\/script>');
    }
  </script>
  <script>
    if (window.tailwind) {
      window.tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Montserrat', 'system-ui', '-apple-system', 'sans-serif'],
            },
            colors: {
              teal: {
                700: '#005853',
                800: '#004440',
                900: '#00312e',
              }
            }
          }
        }
      };
    }
  </script>

  <style>
    * {
      font-family: 'Montserrat', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    }
    body, button, input, select, textarea, table, th, td, p, h1, h2, h3, h4, h5, h6, span, div, a {
      font-family: 'Montserrat', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 antialiased min-h-screen">
  <div id="root">
    <!-- Instant loading placeholder -->
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8fafc; font-family: 'Montserrat', sans-serif;">
      <div style="text-align: center;">
        <div style="width: 44px; height: 44px; border: 4px solid #005853; border-top-color: transparent; border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite;"></div>
        <div style="font-weight: 800; color: #005853; font-size: 16px; letter-spacing: -0.02em; font-family: 'Montserrat', sans-serif;">GSHEETS HOME</div>
        <div style="color: #64748b; font-size: 12px; margin-top: 4px; font-family: 'Montserrat', sans-serif;">Đang tải ứng dụng...</div>
      </div>
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
  </div>

  <!-- React 18 & ReactDOM: Local vendor first, then fallback to CDN -->
  <script src="/vendor/react.production.min.js"></script>
  <script>
    if (!window.React) {
      document.write('<script src="https://unpkg.com/react@18/umd/react.production.min.js"><\/script>');
    }
  </script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script>
    if (!window.ReactDOM) {
      document.write('<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><\/script>');
    }
  </script>

  <!-- Pre-compiled Fast App Bundle -->
  <script src="/app.bundle.js?v=2.4"></script>

  <!-- Safety Fallback: In case of cache issues or network drop, provide 1-click reload button -->
  <script>
    // If after 8 seconds React still hasn't mounted, offer a 1-click reload
    setTimeout(function() {
      var root = document.getElementById('root');
      if (root && root.innerHTML.indexOf('Đang tải ứng dụng') !== -1) {
        root.innerHTML = '<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8fafc; font-family: \'Montserrat\', sans-serif; padding: 20px;">' +
          '<div style="max-width: 450px; background: white; border: 1px solid #e2e8f0; border-radius: 24px; padding: 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center;">' +
            '<div style="font-size: 36px; margin-bottom: 12px;">🏡</div>' +
            '<h3 style="font-weight: 800; color: #005853; margin: 0 0 8px; font-size: 18px; font-family: \'Montserrat\', sans-serif;">GSHEETS HOME</h3>' +
            '<p style="color: #64748b; font-size: 13px; line-height: 1.5; margin: 0 0 20px; font-family: \'Montserrat\', sans-serif;">Máy chủ Render đang hoàn tất khởi động hoặc vừa được cập nhật bản mới. Bấm nút dưới đây để kết nối lại:</p>' +
            '<button onclick="location.reload(true);" style="background: #005853; color: white; border: none; padding: 12px 24px; font-weight: bold; border-radius: 12px; cursor: pointer; font-size: 13px; box-shadow: 0 4px 12px rgba(0,88,83,0.25); font-family: \'Montserrat\', sans-serif;">🔄 Kết nối & Làm mới</button>' +
          '</div>' +
        '</div>';
      }
    }, 8000);

    window.addEventListener('error', function(e) {
      console.error("Global captured error:", e);
      var root = document.getElementById('root');
      if (root && (!root.children.length || root.innerHTML.indexOf('Đang tải ứng dụng') !== -1)) {
        root.innerHTML = '<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8fafc; font-family: \'Montserrat\', sans-serif; padding: 20px;">' +
          '<div style="max-width: 450px; background: white; border: 1px solid #e2e8f0; border-radius: 24px; padding: 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center;">' +
            '<div style="font-size: 36px; margin-bottom: 12px;">🏡</div>' +
            '<h3 style="font-weight: 800; color: #0f172a; margin: 0 0 8px; font-size: 18px; font-family: \'Montserrat\', sans-serif;">GSHEETS HOME</h3>' +
            '<p style="color: #64748b; font-size: 13px; line-height: 1.5; margin: 0 0 20px; font-family: \'Montserrat\', sans-serif;">Hệ thống vừa cập nhật phiên bản mới. Bấm nút dưới đây để làm mới bộ nhớ đệm và tiếp tục sử dụng.</p>' +
            '<button onclick="localStorage.removeItem(\'gsheets_home_token\'); localStorage.removeItem(\'gsheets_home_user\'); location.reload(true);" style="background: #005853; color: white; border: none; padding: 12px 24px; font-weight: bold; border-radius: 12px; cursor: pointer; font-size: 13px; box-shadow: 0 4px 12px rgba(0,88,83,0.25); font-family: \'Montserrat\', sans-serif;">🔄 Làm mới & Tiếp tục</button>' +
          '</div>' +
        '</div>';
      }
    });
  </script>
</body>
</html>
