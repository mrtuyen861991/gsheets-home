<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GSHEETS HOME - Homestay | Nghỉ Dưỡng (Bảo Mật & Phân Quyền)</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- React 18, ReactDOM & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    .bg-striped-diagonal {
      background: repeating-linear-gradient(
        45deg,
        rgba(239, 68, 68, 0.08),
        rgba(239, 68, 68, 0.08) 10px,
        rgba(239, 68, 68, 0.18) 10px,
        rgba(239, 68, 68, 0.18) 20px
      );
    }
    .booking-bar {
      transition: all 0.15s ease-in-out;
    }
    .booking-bar:hover {
      filter: brightness(0.95);
      transform: translateY(-1px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Helper: Format currency to VND
    const formatVND = (num) => {
      if (num === null || num === undefined || isNaN(num)) return '0 đ';
      return Math.round(num).toLocaleString('vi-VN') + ' đ';
    };

    // Helper: Authenticated fetch wrapper (auto includes Bearer token)
    const authFetch = (url, options = {}) => {
      const token = localStorage.getItem('gsheets_home_token');
      const headers = {
        ...(options.headers || {}),
        ...(token ? { 'Authorization': `Bearer ${token}` } : {})
      };
      return fetch(url, { ...options, headers });
    };

    // Main App Component
    function App() {
      // 1. App Authentication State
      const [token, setToken] = useState(() => localStorage.getItem('gsheets_home_token') || null);
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('gsheets_home_user');
          return saved ? JSON.parse(saved) : null;
        } catch (e) { return null; }
      });

      // App Data State
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [currentScreen, setCurrentScreen] = useState('dashboard');
      const [selectedPropertyFilter, setSelectedPropertyFilter] = useState('all');
      const [globalSearch, setGlobalSearch] = useState('');
      const [toast, setToast] = useState(null);
      const [userMenuOpen, setUserMenuOpen] = useState(false);
      const [syncingGSheets, setSyncingGSheets] = useState(false);

      // Modals
      const [showChangePasswordModal, setShowChangePasswordModal] = useState(false);
      const [showNewBookingModal, setShowNewBookingModal] = useState(false);
      const [showGroupBookingModal, setShowGroupBookingModal] = useState(false);
      const [showPaymentModal, setShowPaymentModal] = useState(false);
      const [showCustomerModal, setShowCustomerModal] = useState(false);
      const [showUserModal, setShowUserModal] = useState(false);
      const [showVoucherModal, setShowVoucherModal] = useState(false);
      const [selectedBookingForVoucher, setSelectedBookingForVoucher] = useState(null);
      const [selectedBookingDetail, setSelectedBookingDetail] = useState(null);
      const [bookingModalInitialData, setBookingModalInitialData] = useState(null);

      // Toast Notification
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Fetch bootstrap data with token
      const refreshData = async (activeToken = token) => {
        if (!activeToken) {
          setLoading(false);
          setData(null);
          setCurrentUser(null);
          return;
        }

        try {
          const res = await authFetch('/api/bootstrap');
          if (res.status === 401 || res.status === 403) {
            // Unauthorized or token expired
            localStorage.removeItem('gsheets_home_token');
            localStorage.removeItem('gsheets_home_user');
            setToken(null);
            setCurrentUser(null);
            setData(null);
            setLoading(false);
            return;
          }

          const json = await res.json();
          setData(json);
          if (json.currentUser) {
            setCurrentUser(json.currentUser);
            localStorage.setItem('gsheets_home_user', JSON.stringify(json.currentUser));
            // Auto lock filter if scoped
            if (json.currentUser.propertyScope && json.currentUser.propertyScope !== 'all') {
              setSelectedPropertyFilter(json.currentUser.propertyScope);
            }
          }
          setLoading(false);
        } catch (err) {
          console.error('Fetch error:', err);
          showToast('Lỗi tải dữ liệu: ' + err.message, 'error');
          setLoading(false);
        }
      };

      useEffect(() => {
        refreshData();
      }, [token]);

      // Logout handler
      const handleLogout = async () => {
        try {
          await authFetch('/api/auth/logout', { method: 'POST' });
        } catch (e) {}
        localStorage.removeItem('gsheets_home_token');
        localStorage.removeItem('gsheets_home_user');
        setToken(null);
        setCurrentUser(null);
        setData(null);
        setUserMenuOpen(false);
        showToast('🚪 Đã đăng xuất an toàn khỏi hệ thống!');
      };

      // Login success handler
      const handleLoginSuccess = (newToken, newUser) => {
        localStorage.setItem('gsheets_home_token', newToken);
        localStorage.setItem('gsheets_home_user', JSON.stringify(newUser));
        setToken(newToken);
        setCurrentUser(newUser);
        showToast(`🎉 Xin chào, ${newUser.name}! Chúc bạn một ngày làm việc hiệu quả.`);
        refreshData(newToken);
      };

      // Check permission helper (Role Based Access Control)
      const hasPermission = (moduleName, action = 'view') => {
        if (!currentUser) return false;
        if (currentUser.role === 'admin') return true;
        const modPerm = currentUser.permissions && currentUser.permissions[moduleName];
        if (!modPerm) return false;
        return !!modPerm[action];
      };

      // Filtered properties based on user scope
      const userAllowedProperties = useMemo(() => {
        if (!data || !data.properties) return [];
        if (!currentUser || currentUser.propertyScope === 'all') {
          return data.properties;
        }
        return data.properties.filter(p => p.id === currentUser.propertyScope);
      }, [data, currentUser]);

      // Filtered rooms
      const filteredRooms = useMemo(() => {
        if (!data || !data.rooms) return [];
        let list = data.rooms;
        if (currentUser && currentUser.propertyScope !== 'all') {
          list = list.filter(r => r.propertyId === currentUser.propertyScope);
        }
        if (selectedPropertyFilter !== 'all') {
          list = list.filter(r => r.propertyId === selectedPropertyFilter);
        }
        return list;
      }, [data, currentUser, selectedPropertyFilter]);

      // Filtered bookings
      const filteredBookings = useMemo(() => {
        if (!data || !data.bookings) return [];
        let list = data.bookings;
        if (currentUser && currentUser.propertyScope !== 'all') {
          list = list.filter(b => b.propertyId === currentUser.propertyScope);
        }
        if (selectedPropertyFilter !== 'all') {
          list = list.filter(b => b.propertyId === selectedPropertyFilter);
        }
        if (globalSearch.trim()) {
          const q = globalSearch.toLowerCase().trim();
          list = list.filter(b =>
            (b.id && b.id.toLowerCase().includes(q)) ||
            (b.customerName && b.customerName.toLowerCase().includes(q)) ||
            (b.customerPhone && b.customerPhone.includes(q)) ||
            (b.roomName && b.roomName.toLowerCase().includes(q))
          );
        }
        return list;
      }, [data, currentUser, selectedPropertyFilter, globalSearch]);

      // 1-touch Check-in
      const handleCheckIn = async (bookingId) => {
        try {
          const res = await authFetch(`/api/bookings/${bookingId}/checkin`, { method: 'POST' });
          if (res.ok) {
            showToast('✅ Đã nhận phòng thành công!');
            refreshData();
          }
        } catch (e) {
          showToast('Lỗi nhận phòng: ' + e.message, 'error');
        }
      };

      // 1-touch Check-out
      const handleCheckOut = async (bookingId) => {
        try {
          const res = await authFetch(`/api/bookings/${bookingId}/checkout`, { method: 'POST' });
          if (res.ok) {
            showToast('✅ Đã trả phòng thành công! Phòng đã được gắn nhãn Cần dọn dẹp.');
            refreshData();
          }
        } catch (e) {
          showToast('Lỗi trả phòng: ' + e.message, 'error');
        }
      };

      // Clean all rooms in 1 click
      const handleCleanAll = async () => {
        try {
          const res = await authFetch('/api/rooms/clean-all', { method: 'POST' });
          const json = await res.json();
          showToast(`🧹 Đã dọn dẹp tất cả ${json.cleanedCount || 0} phòng bẩn thành phòng sạch!`);
          refreshData();
        } catch (e) {
          showToast('Lỗi: ' + e.message, 'error');
        }
      };

      // Sync Google Sheets
      const handleSyncGoogleSheets = async () => {
        setSyncingGSheets(true);
        try {
          const res = await authFetch('/api/sync/gsheets', { method: 'POST' });
          const json = await res.json();
          setSyncingGSheets(false);
          showToast('📊 ' + json.message);
        } catch (e) {
          setSyncingGSheets(false);
          showToast('Lỗi đồng bộ Google Sheets: ' + e.message, 'error');
        }
      };

      // Open new booking modal from calendar drag / select
      const handleOpenBookingWithRange = (roomId, checkInDate, checkOutDate) => {
        const room = (data?.rooms || []).find(r => r.id === roomId);
        setBookingModalInitialData({
          roomId,
          propertyId: room ? room.propertyId : '',
          checkInDate,
          checkOutDate
        });
        setShowNewBookingModal(true);
      };

      // ==========================================
      // SECURITY GATE: BẮT BUỘC ĐĂNG NHẬP
      // ==========================================
      if (!token || !currentUser) {
        return (
          <FullLoginGate onLoginSuccess={handleLoginSuccess} />
        );
      }

      if (loading) {
        return (
          <div className="flex flex-col items-center justify-center min-h-screen bg-slate-50">
            <div className="w-12 h-12 border-4 border-teal-600 border-t-transparent rounded-full animate-spin"></div>
            <p className="mt-4 font-bold text-teal-800 text-lg">Đang xác thực bảo mật & tải GSHEETS HOME...</p>
            <p className="text-xs text-slate-400">Đăng nhập bởi: {currentUser?.name}</p>
          </div>
        );
      }

      return (
        <div className="flex min-h-screen bg-[#f8fafc]">
          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className={`fixed bottom-20 right-4 sm:top-5 sm:bottom-auto z-50 px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 text-white text-sm font-semibold transition-all transform animate-bounce ${
              toast.type === 'error' ? 'bg-rose-600' : 'bg-teal-700'
            }`}>
              <span>{toast.message}</span>
            </div>
          )}

          {/* DESKTOP SIDEBAR - STRICT RBAC VISIBILITY */}
          <aside className="hidden lg:flex flex-col w-64 bg-white border-r border-slate-200 shrink-0 select-none">
            {/* Logo */}
            <div className="p-5 border-b border-slate-100 flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-600 to-emerald-500 flex items-center justify-center text-white text-xl shadow-md shadow-teal-500/20">
                🏡
              </div>
              <div>
                <h1 className="font-extrabold text-base tracking-tight text-slate-900">GSHEETS HOME</h1>
                <p className="text-[11px] font-medium text-slate-400">Homestay | Nghỉ Dưỡng</p>
              </div>
            </div>

            {/* Menu Items with Permission Filtering */}
            <div className="flex-1 overflow-y-auto px-3 py-4 space-y-6">
              {/* Group 1: VẬN HÀNH */}
              <div>
                <div className="px-3 mb-2 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">
                  VẬN HÀNH
                </div>
                <nav className="space-y-1">
                  {[
                    { id: 'dashboard', label: 'Tổng quan', icon: '🟢', show: true },
                    { id: 'calendar', label: 'Lịch phòng', icon: '📅', show: hasPermission('booking') },
                    { id: 'bookings', label: 'Đặt phòng', icon: '📝', show: hasPermission('booking') },
                    { id: 'housekeeping', label: 'Buồng phòng', icon: '🧹', show: hasPermission('housekeeping') },
                    { id: 'payments', label: 'Thu tiền', icon: '💵', show: hasPermission('payment') }
                  ].filter(i => i.show).map(item => (
                    <button
                      key={item.id}
                      onClick={() => setCurrentScreen(item.id)}
                      className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl font-semibold text-xs transition ${
                        currentScreen === item.id
                          ? 'bg-teal-50 text-teal-800 shadow-sm border border-teal-100/60 font-bold'
                          : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'
                      }`}
                    >
                      <span className="flex items-center gap-2.5">
                        <span className="text-base">{item.icon}</span>
                        {item.label}
                      </span>
                      {currentScreen === item.id && <span className="w-1.5 h-1.5 rounded-full bg-teal-600"></span>}
                    </button>
                  ))}
                </nav>
              </div>

              {/* Group 2: KHÁCH & SỐ LIỆU */}
              <div>
                <div className="px-3 mb-2 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">
                  KHÁCH & SỐ LIỆU
                </div>
                <nav className="space-y-1">
                  {[
                    { id: 'customers', label: 'Khách hàng', icon: '👥', show: hasPermission('customer') },
                    { id: 'reports', label: 'Báo cáo doanh thu', icon: '📊', show: hasPermission('reports') }
                  ].filter(i => i.show).map(item => (
                    <button
                      key={item.id}
                      onClick={() => setCurrentScreen(item.id)}
                      className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl font-semibold text-xs transition ${
                        currentScreen === item.id
                          ? 'bg-teal-50 text-teal-800 shadow-sm border border-teal-100/60 font-bold'
                          : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'
                      }`}
                    >
                      <span className="flex items-center gap-2.5">
                        <span className="text-base">{item.icon}</span>
                        {item.label}
                      </span>
                      {currentScreen === item.id && <span className="w-1.5 h-1.5 rounded-full bg-teal-600"></span>}
                    </button>
                  ))}
                </nav>
              </div>

              {/* Group 3: HỆ THỐNG */}
              <div>
                <div className="px-3 mb-2 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">
                  HỆ THỐNG
                </div>
                <nav className="space-y-1">
                  {[
                    { id: 'properties', label: 'Cơ sở & phòng', icon: '🏨', show: hasPermission('property') },
                    { id: 'users', label: 'Người dùng & Quyền', icon: '👤', show: currentUser?.role === 'admin' },
                    { id: 'settings', label: 'Cài đặt hệ thống', icon: '⚙️', show: currentUser?.role === 'admin' },
                    { id: 'guide', label: 'Hướng dẫn sử dụng', icon: '❓', show: true }
                  ].filter(i => i.show).map(item => (
                    <button
                      key={item.id}
                      onClick={() => setCurrentScreen(item.id)}
                      className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl font-semibold text-xs transition ${
                        currentScreen === item.id
                          ? 'bg-teal-50 text-teal-800 shadow-sm border border-teal-100/60 font-bold'
                          : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'
                      }`}
                    >
                      <span className="flex items-center gap-2.5">
                        <span className="text-base">{item.icon}</span>
                        {item.label}
                      </span>
                      {currentScreen === item.id && <span className="w-1.5 h-1.5 rounded-full bg-teal-600"></span>}
                    </button>
                  ))}
                </nav>
              </div>
            </div>

            {/* Sidebar Bottom Footer */}
            <div className="p-3 border-t border-slate-100 text-[11px] text-slate-400 flex items-center justify-between">
              <div>
                <div className="font-bold text-slate-700">{currentUser?.name}</div>
                <div className="text-[10px] text-teal-700 font-semibold">{currentUser?.roleLabel}</div>
              </div>
              <span className="text-[10px] bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded font-mono font-bold">🔒 An toàn</span>
            </div>
          </aside>

          {/* MAIN WRAPPER */}
          <div className="flex-1 flex flex-col min-w-0 pb-16 lg:pb-0">
            {/* TOP HEADER */}
            <header className="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200/80 px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <h2 className="font-bold text-base sm:text-lg text-slate-900 capitalize flex items-center gap-2">
                  <span className="lg:hidden text-lg">🏡</span>
                  {currentScreen === 'dashboard' && 'Tổng quan hôm nay'}
                  {currentScreen === 'calendar' && 'Lịch phòng'}
                  {currentScreen === 'bookings' && 'Quản lý Đặt phòng'}
                  {currentScreen === 'housekeeping' && 'Buồng phòng'}
                  {currentScreen === 'payments' && 'Sổ quỹ Thu tiền'}
                  {currentScreen === 'customers' && 'Hồ sơ Khách hàng'}
                  {currentScreen === 'reports' && 'Báo cáo doanh thu'}
                  {currentScreen === 'properties' && 'Cơ sở & Loại phòng'}
                  {currentScreen === 'users' && 'Người dùng & Phân quyền'}
                  {currentScreen === 'settings' && 'Cài đặt hệ thống'}
                  {currentScreen === 'guide' && 'Hướng dẫn sử dụng'}
                </h2>
              </div>

              {/* Right controls */}
              <div className="flex items-center gap-2 sm:gap-4">
                {/* Global Search Input */}
                <div className="relative hidden md:block w-64 lg:w-72">
                  <span className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 text-sm">
                    🔍
                  </span>
                  <input
                    type="text"
                    value={globalSearch}
                    onChange={(e) => setGlobalSearch(e.target.value)}
                    placeholder="Tìm đơn, khách, phòng... (Ctrl+K)"
                    className="w-full pl-9 pr-4 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200/80 focus:bg-white text-xs border border-transparent focus:border-teal-500 focus:outline-none transition"
                  />
                  {globalSearch && (
                    <button
                      onClick={() => setGlobalSearch('')}
                      className="absolute inset-y-0 right-0 pr-3 flex items-center text-xs text-slate-400"
                    >
                      ✕
                    </button>
                  )}
                </div>

                {/* Google Sheets Sync Button */}
                <button
                  onClick={handleSyncGoogleSheets}
                  disabled={syncingGSheets}
                  className="p-2 sm:px-3 sm:py-1.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-semibold border border-emerald-200/80 flex items-center gap-1.5 transition active:scale-95"
                  title="Đồng bộ ngay sang Google Sheets"
                >
                  <span className={syncingGSheets ? 'animate-spin' : ''}>🔄</span>
                  <span className="hidden sm:inline">Google Sheets</span>
                </button>

                {/* User Dropdown */}
                <div className="relative">
                  <button
                    onClick={() => setUserMenuOpen(!userMenuOpen)}
                    className="flex items-center gap-2 pl-2 pr-3 py-1.5 rounded-xl hover:bg-slate-100 transition border border-transparent hover:border-slate-200"
                  >
                    <div className="w-8 h-8 rounded-full bg-teal-700 text-white font-bold text-xs flex items-center justify-center uppercase shadow-sm">
                      {currentUser?.name ? currentUser.name.slice(0, 2) : 'AD'}
                    </div>
                    <div className="hidden sm:block text-left text-xs">
                      <div className="font-bold text-slate-800 leading-tight">{currentUser?.name}</div>
                      <div className="text-[10px] text-slate-400">{currentUser?.roleLabel}</div>
                    </div>
                    <span className="text-[10px] text-slate-400">▼</span>
                  </button>

                  {/* Dropdown Menu */}
                  {userMenuOpen && (
                    <div className="absolute right-0 mt-2 w-60 bg-white rounded-2xl shadow-2xl border border-slate-100 py-2 z-50 text-xs">
                      <div className="px-4 py-2 border-b border-slate-100">
                        <div className="font-bold text-slate-900">{currentUser?.name}</div>
                        <div className="text-slate-400 text-[11px]">Tài khoản: <b>{currentUser?.username}</b></div>
                        <div className="text-[10px] text-teal-700 mt-1 font-semibold">Phạm vi: {currentUser?.propertyScopeLabel}</div>
                      </div>

                      <button
                        onClick={() => { setUserMenuOpen(false); setShowChangePasswordModal(true); }}
                        className="w-full text-left px-4 py-2.5 hover:bg-slate-50 text-slate-700 flex items-center gap-2"
                      >
                        <span>🔑</span> Đổi mật khẩu
                      </button>

                      {currentUser?.role === 'admin' && (
                        <button
                          onClick={() => { setUserMenuOpen(false); setCurrentScreen('settings'); }}
                          className="w-full text-left px-4 py-2.5 hover:bg-slate-50 text-slate-700 flex items-center gap-2"
                        >
                          <span>⚙️</span> Cài đặt hệ thống
                        </button>
                      )}

                      <div className="border-t border-slate-100 my-1"></div>
                      <button
                        onClick={handleLogout}
                        className="w-full text-left px-4 py-2.5 hover:bg-rose-50 text-rose-600 font-bold flex items-center gap-2"
                      >
                        <span>🚪</span> Đăng xuất an toàn
                      </button>

    function FullLoginGate({ onLoginSuccess }) {
      const [username, setUsername] = useState('admin');

            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const json = await res.json();
          if (res.ok) {
            onLoginSuccess(json.token, json.user);
          } else {
            setError(json.error || 'Đăng nhập không thành công');
          }
        } catch (err) {
          setError('Lỗi kết nối máy chủ: ' + err.message);
        } finally {
          setLoading(false);

        setUsername(u);

              GSHEETS HOME · Phiên bản 1.0 (Bảo mật RBAC)

          </div>
        </div>
      );
    }

    // ==========================================
    // MODAL: CHANGE PASSWORD (ĐỔI MẬT KHẨU)
    // ==========================================
    function ChangePasswordModal({ onClose, onSuccess }) {
      const [oldPassword, setOldPassword] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [error, setError] = useState('');
      const [submitting, setSubmitting] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');

        if (newPassword !== confirmPassword) {
          setError('Mật khẩu xác nhận không khớp');
          return;
        }

        if (newPassword.length < 3) {
          setError('Mật khẩu mới phải có ít nhất 3 ký tự');
          return;
        }

        setSubmitting(true);
        try {
          const res = await authFetch('/api/auth/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ oldPassword, newPassword })
          });
          const json = await res.json();
          if (res.ok) {
            onSuccess();
          } else {
            setError(json.error || 'Không thể đổi mật khẩu');
          }
        } catch (e) {
          setError('Lỗi kết nối: ' + e.message);
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4 text-xs">
            <div className="flex items-center justify-between pb-3 border-b border-slate-100">
              <h3 className="font-extrabold text-base text-slate-900 flex items-center gap-2">
                <span>🔑 Đổi Mật Khẩu Đăng Nhập</span>
              </h3>
              <button onClick={onClose} className="p-1 rounded-xl hover:bg-slate-100 text-slate-400">✕</button>
            </div>

            {error && (
              <div className="p-2.5 rounded-xl bg-rose-50 text-rose-700 font-bold">
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-3">
              <div>
                <label className="font-bold text-slate-700 block mb-1">Mật khẩu hiện tại *</label>
                <input
                  type="password"
                  required
                  value={oldPassword}
                  onChange={(e) => setOldPassword(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs focus:ring-2 focus:ring-teal-500"
                />
              </div>

              <div>
                <label className="font-bold text-slate-700 block mb-1">Mật khẩu mới *</label>
                <input
                  type="password"
                  required
                  value={newPassword}
                  onChange={(e) => setNewPassword(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs focus:ring-2 focus:ring-teal-500"
                />
              </div>

              <div>
                <label className="font-bold text-slate-700 block mb-1">Xác nhận mật khẩu mới *</label>
                <input
                  type="password"
                  required
                  value={confirmPassword}
                  onChange={(e) => setConfirmPassword(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs focus:ring-2 focus:ring-teal-500"
                />
              </div>

              <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl bg-slate-100 font-bold text-slate-600">Hủy</button>
                <button type="submit" disabled={submitting} className="px-5 py-2 rounded-xl bg-teal-700 text-white font-bold shadow-md">
                  {submitting ? 'Đang lưu...' : 'Lưu Mật Khẩu'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function CalendarTimelineScreen({ data, filteredRooms, filteredBookings, onSelectRange, onViewBooking }) {
      const [viewDays, setViewDays] = useState(14);
      const [startDateOffset, setStartDateOffset] = useState(0);
      const baseDate = new Date('2026-11-12');

      const timelineDates = useMemo(() => {
        const dates = [];
        const start = new Date(baseDate);
        start.setDate(start.getDate() + startDateOffset);
        const dayNames = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];

        for (let i = 0; i < viewDays; i++) {
          const d = new Date(start);
          d.setDate(d.getDate() + i);
          const yyyy = d.getFullYear();
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          const dateStr = `${yyyy}-${mm}-${dd}`;
          const isToday = (dd === '13' && mm === '11');

          dates.push({
            dateStr,
            day: dd,
            month: mm,
            dayOfWeek: dayNames[d.getDay()],
            isToday,
            isWeekend: (d.getDay() === 5 || d.getDay() === 6)
          });
        }
        return dates;
      }, [baseDate, startDateOffset, viewDays]);

      const roomsByProperty = useMemo(() => {
        const map = {};
        (filteredRooms || []).forEach(r => {
          if (!map[r.propertyId]) map[r.propertyId] = [];
          map[r.propertyId].push(r);
        });
        return map;
      }, [filteredRooms]);

      const handleCellClick = (room, dateItem) => {
        if (room.housekeepingStatus === 'maintenance') {
          alert(`Phòng ${room.name} đang bảo trì (${room.maintenanceReason || 'Đang sửa chữa'}), không thể đặt!`);
          return;
        }
        const nextDate = new Date(dateItem.dateStr);
        nextDate.setDate(nextDate.getDate() + 2);
        const nextDateStr = nextDate.toISOString().split('T')[0];
        onSelectRange(room.id, dateItem.dateStr, nextDateStr);
      };

      return (
        <div className="bg-white rounded-3xl border border-slate-200/80 shadow-sm overflow-hidden flex flex-col">
          <div className="p-4 sm:p-5 border-b border-slate-100 flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center gap-2">
              <button
                onClick={() => setStartDateOffset(o => o - 7)}
                className="w-8 h-8 rounded-xl border border-slate-200 flex items-center justify-center hover:bg-slate-50 text-slate-600 font-bold"
              >
                ‹
              </button>
              <button
                onClick={() => setStartDateOffset(0)}
                className="px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-700 hover:bg-slate-50"
              >
                Hôm nay
              </button>
              <button
                onClick={() => setStartDateOffset(o => o + 7)}
                className="w-8 h-8 rounded-xl border border-slate-200 flex items-center justify-center hover:bg-slate-50 text-slate-600 font-bold"
              >
                ›
              </button>
              <span className="text-xs font-bold text-slate-800 ml-2">
                📅 {timelineDates[0]?.day}/{timelineDates[0]?.month} - {timelineDates[timelineDates.length - 1]?.day}/{timelineDates[timelineDates.length - 1]?.month}/2026
              </span>
            </div>

            <div className="flex flex-wrap items-center gap-3">
              <div className="flex p-1 bg-slate-100 rounded-xl text-xs font-bold">
                {[7, 14, 30].map(days => (
                  <button
                    key={days}
                    onClick={() => setViewDays(days)}
                    className={`px-3 py-1 rounded-lg transition ${viewDays === days ? 'bg-white text-teal-800 shadow-sm' : 'text-slate-500'}`}
                  >
                    {days} ngày
                  </button>
                ))}
              </div>

              <div className="hidden xl:flex items-center gap-3 text-xs font-medium text-slate-600">
                <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-amber-400"></span> Giữ chỗ</span>
                <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-sky-500"></span> Đã xác nhận</span>
                <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Đang ở</span>
                <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-slate-400"></span> Đã trả</span>
                <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-rose-600"></span> Còn nợ</span>
              </div>
            </div>
          </div>

          <div className="px-5 py-2 bg-amber-50/50 border-b border-amber-100/60 text-[11px] text-amber-800 flex items-center justify-between">
            <span>💡 <b>Mẹo thao tác:</b> Bấm hoặc kéo chuột trên các ô ngày trống để mở ngay form <b>Đặt phòng mới</b> với phòng & ngày tự điền.</span>
          </div>

          <div className="overflow-x-auto relative">
            <table className="w-full border-collapse text-xs select-none">
              <thead>
                <tr className="bg-slate-50/90 border-b border-slate-200">
                  <th className="sticky left-0 z-20 bg-slate-100 p-3 text-left font-extrabold text-slate-700 w-44 min-w-[176px] border-r border-slate-200">
                    PHÒNG
                  </th>
                  {timelineDates.map(d => (
                    <th
                      key={d.dateStr}
                      className={`p-2 text-center border-r border-slate-200 min-w-[65px] ${
                        d.isToday ? 'bg-teal-50 text-teal-800' : d.isWeekend ? 'bg-slate-100/50' : ''
                      }`}
                    >
                      <div className="text-[10px] text-slate-400 uppercase font-bold">{d.dayOfWeek}</div>
                      <div className={`text-sm font-extrabold mt-0.5 inline-block px-1.5 py-0.2 rounded-full ${
                        d.isToday ? 'bg-teal-700 text-white' : 'text-slate-800'
                      }`}>
                        {d.day}
                      </div>
                      <div className="text-[9px] text-slate-400">th{d.month}</div>
                    </th>
                  ))}
                </tr>
              </thead>

              <tbody>
                {Object.entries(roomsByProperty).map(([propId, pRooms]) => {
                  const prop = (data?.properties || []).find(p => p.id === propId) || { name: 'Cơ sở' };
                  return (
                    <React.Fragment key={propId}>
                      <tr className="bg-teal-50/80 border-b border-teal-100 font-bold text-teal-900">
                        <td className="sticky left-0 z-10 bg-teal-50/90 p-2.5 px-3 border-r border-teal-200">
                          🏨 {prop.name} ({pRooms.length} phòng)
                        </td>
                        {timelineDates.map(d => (
                          <td key={d.dateStr} className="p-1 text-center border-r border-teal-100 text-[10px] text-teal-700">
                            {Math.max(1, pRooms.length - 2)}
                          </td>
                        ))}
                      </tr>

                      {pRooms.map(room => {
                        const roomType = (data?.roomTypes || []).find(rt => rt.id === room.roomTypeId) || {};
                        const isMaintenance = room.housekeepingStatus === 'maintenance';
                        const roomBookings = filteredBookings.filter(b => b.roomId === room.id);

                        return (
                          <tr key={room.id} className="border-b border-slate-100 hover:bg-slate-50/40 relative h-12">
                            <td className="sticky left-0 z-10 bg-white p-2.5 px-3 border-r border-slate-200 flex items-center justify-between">
                              <div>
                                <span className="font-extrabold text-sm text-slate-900">{room.name}</span>
                                <div className="text-[10px] text-slate-400 leading-tight">{roomType.name || ''}</div>
                              </div>
                              {isMaintenance && (
                                <span className="text-xs text-rose-500 font-bold" title={room.maintenanceReason || 'Bảo trì'}>
                                  🛠️
                                </span>
                              )}
                            </td>

                            {timelineDates.map(d => {
                              const booking = roomBookings.find(b => d.dateStr >= b.checkInDate && d.dateStr < b.checkOutDate);

                              return (
                                <td
                                  key={d.dateStr}
                                  onClick={() => handleCellClick(room, d)}
                                  className={`p-1 border-r border-slate-100 relative cursor-pointer hover:bg-teal-50/30 ${
                                    isMaintenance ? 'bg-striped-diagonal cursor-not-allowed' : ''
                                  } ${d.isToday ? 'bg-teal-50/20' : ''}`}
                                >
                                  {booking && (
                                    <div
                                      onClick={(e) => {
                                        e.stopPropagation();
                                        onViewBooking(booking);
                                      }}
                                      className={`booking-bar w-full h-8 rounded-lg px-2 flex items-center justify-between text-[11px] font-bold text-white shadow-sm overflow-hidden ${
                                        booking.status === 'in_house' ? 'bg-emerald-600' :
                                        booking.status === 'hold' ? 'bg-amber-500' :
                                        booking.status === 'checked_out' ? 'bg-slate-400' : 'bg-sky-600'
                                      }`}
                                      title={`${booking.customerName} (${booking.checkInDate} - ${booking.checkOutDate})`}
                                    >
                                      <span className="truncate">{booking.customerName}</span>
                                      {booking.balance > 0 && (
                                        <span className="w-2 h-2 rounded-full bg-rose-500 shrink-0 ml-1" title={`Còn nợ: ${formatVND(booking.balance)}`}></span>
                                      )}
                                    </div>
                                  )}
                                </td>
                              );
                            })}
                          </tr>
                        );
                      })}
                    </React.Fragment>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

                        b.status === 'checked_out' ? 'bg-slate-200 text-slate-700' : 'bg-sky-100 text-sky-800'
                      }`}>

                    <td className="py-3 px-2 text-right font-bold text-slate-900">

                    <td className="py-3 px-2 text-right">
                      {b.balance > 0 ? (
                        <span className="font-bold text-rose-600">{formatVND(b.balance)}</span>

                        <span className="text-emerald-600 font-bold">Đủ</span>
                      )}
                    </td>
                    <td className="py-3 px-2 text-center">
                      <div className="flex items-center justify-center gap-1.5">
                        {b.status === 'confirmed' && (
                          <button
                            onClick={() => onCheckIn(b.id)}
                            className="px-2.5 py-1 rounded-lg bg-teal-600 text-white font-bold text-[10px] hover:bg-teal-700"
                          >
                            Nhận
                          </button>
                        )}
                        {b.status === 'in_house' && (
                          <button
                            onClick={() => onCheckOut(b.id)}
                            className="px-2.5 py-1 rounded-lg bg-slate-700 text-white font-bold text-[10px] hover:bg-slate-800"
                          >
                            Trả
                          </button>
                        )}
                        <button
                          onClick={() => onPrintVoucher(b)}
                          className="p-1 rounded-lg text-slate-500 hover:bg-slate-200"
                          title="In phiếu xác nhận"
                        >
                          🖨️
                        </button>
                        <button
                          onClick={() => onViewDetail(b)}
                          className="p-1 rounded-lg text-teal-600 hover:bg-teal-50"
                          title="Xem chi tiết"
                        >
                          👁️
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ==========================================
    // SCREEN 4: HOUSEKEEPING (BUỒNG PHÒNG 6 MÀU)
    // ==========================================
    function HousekeepingScreen({ data, rooms, onCleanAll, onRefresh, showToast }) {
      const [filterStatus, setFilterStatus] = useState('all');

      const counts = useMemo(() => {
        const c = { occupied: 0, due_out: 0, arriving: 0, clean: 0, dirty: 0, maintenance: 0 };
        (rooms || []).forEach(r => {
          if (c[r.housekeepingStatus] !== undefined) c[r.housekeepingStatus]++;
        });
        return c;
      }, [rooms]);

      const handleUpdateStatus = async (roomId, newStatus) => {
        try {
          const res = await authFetch(`/api/rooms/${roomId}/housekeeping`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: newStatus })
          });
          if (res.ok) {
            showToast('✅ Đã cập nhật trạng thái phòng!');
            onRefresh();
          }
        } catch (e) {
          showToast('Lỗi: ' + e.message, 'error');
        }
      };

      const roomsByProp = useMemo(() => {
        const map = {};
        (rooms || []).forEach(r => {
          if (filterStatus !== 'all' && r.housekeepingStatus !== filterStatus) return;
          if (!map[r.propertyId]) map[r.propertyId] = [];
          map[r.propertyId].push(r);
        });
        return map;
      }, [rooms, filterStatus]);

      return (
        <div className="space-y-6">
          <div className="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200/80 shadow-sm space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <div>
                <h3 className="font-extrabold text-xl text-slate-900">Buồng phòng</h3>
                <p className="text-xs text-slate-500">Tình trạng phòng hôm nay — bấm vào phòng để nhận / trả phòng hoặc đánh dấu đã dọn</p>
              </div>

              <button
                onClick={onCleanAll}
                className="px-4 py-2.5 rounded-xl bg-teal-700 hover:bg-teal-800 text-white font-bold text-xs shadow-md shadow-teal-700/20 flex items-center gap-2 transition active:scale-95"
              >
                <span>🧹 Đã dọn tất cả</span>
              </button>
            </div>

            <div className="flex flex-wrap gap-2 pt-2">
              {[
                { id: 'occupied', label: 'Đang ở', count: counts.occupied, colorClass: 'bg-sky-100 text-sky-800 border-sky-300' },
                { id: 'due_out', label: 'Đến hạn trả', count: counts.due_out, colorClass: 'bg-rose-100 text-rose-800 border-rose-300' },
                { id: 'arriving', label: 'Khách đến hôm nay', count: counts.arriving, colorClass: 'bg-purple-100 text-purple-800 border-purple-300' },
                { id: 'clean', label: 'Trống – sẵn sàng', count: counts.clean, colorClass: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
                { id: 'dirty', label: 'Trống – chưa dọn', count: counts.dirty, colorClass: 'bg-amber-100 text-amber-800 border-amber-300' },
                { id: 'maintenance', label: 'Bảo trì', count: counts.maintenance, colorClass: 'bg-slate-200 text-slate-800 border-slate-300' }
              ].map(badge => (
                <button
                  key={badge.id}
                  onClick={() => setFilterStatus(filterStatus === badge.id ? 'all' : badge.id)}
                  className={`px-3 py-1.5 rounded-xl border text-xs font-bold flex items-center gap-2 transition ${badge.colorClass} ${
                    filterStatus === badge.id ? 'ring-2 ring-teal-600 scale-105 shadow-sm' : 'opacity-85 hover:opacity-100'
                  }`}
                >
                  <span>{badge.label}</span>
                  <span className="w-5 h-5 rounded-full bg-white/80 flex items-center justify-center text-[10px]">
                    {badge.count}
                  </span>
                </button>
              ))}
            </div>
          </div>

          {Object.entries(roomsByProp).map(([propId, rList]) => {
            const prop = (data?.properties || []).find(p => p.id === propId) || { name: 'Cơ sở' };
            return (
              <div key={propId} className="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200/80 shadow-sm space-y-4">
                <h4 className="font-extrabold text-base text-slate-800 flex items-center gap-2">
                  <span>🏨 {prop.name}</span>
                  <span className="text-xs text-slate-400 font-normal">({rList.length} phòng)</span>
                </h4>

                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3.5">
                  {rList.map(room => {
                    const roomType = (data?.roomTypes || []).find(rt => rt.id === room.roomTypeId) || {};

                    const statusStyles = {
                      clean: { bg: 'bg-emerald-50/70 border-emerald-300 text-emerald-800', label: 'Trống – sẵn sàng', badge: 'bg-emerald-600 text-white' },
                      dirty: { bg: 'bg-amber-50/70 border-amber-300 text-amber-800', label: 'Trống – chưa dọn', badge: 'bg-amber-600 text-white' },
                      occupied: { bg: 'bg-sky-50/70 border-sky-300 text-sky-800', label: 'Đang ở', badge: 'bg-sky-600 text-white' },
                      due_out: { bg: 'bg-rose-50/70 border-rose-300 text-rose-800', label: 'Đến hạn trả', badge: 'bg-rose-600 text-white' },
                      arriving: { bg: 'bg-purple-50/70 border-purple-300 text-purple-800', label: 'Khách đến hôm nay', badge: 'bg-purple-600 text-white' },
                      maintenance: { bg: 'bg-slate-100 border-slate-300 text-slate-800', label: 'Bảo trì', badge: 'bg-slate-600 text-white' }
                    };

                    const style = statusStyles[room.housekeepingStatus] || statusStyles.clean;

                    return (
                      <div
                        key={room.id}
                        className={`p-3.5 rounded-2xl border ${style.bg} flex flex-col justify-between transition hover:shadow-md cursor-pointer`}
                      >
                        <div>
                          <div className="flex items-start justify-between">
                            <span className="text-xl font-black text-slate-900">{room.name}</span>
                            <span className="text-xs">
                              {room.housekeepingStatus === 'clean' ? '🧼' :
                               room.housekeepingStatus === 'dirty' ? '🧹' :
                               room.housekeepingStatus === 'maintenance' ? '🛠️' : '🛏️'}
                            </span>
                          </div>
                          <div className="text-[10px] text-slate-500 font-medium truncate mt-0.5">
                            {roomType.name} · {room.floor}
                          </div>

                          <div className="mt-2.5">
                            <span className={`inline-block px-2 py-0.5 rounded-full text-[9px] font-bold ${style.badge}`}>
                              {style.label}
                            </span>
                          </div>
                        </div>

                        <div className="mt-3 pt-2 border-t border-black/5 flex items-center justify-between text-[10px]">
                          <span className="truncate text-slate-500">
                            {room.nextGuest || (room.maintenanceReason || 'Sẵn sàng đón khách')}
                          </span>
                          
                          {room.housekeepingStatus === 'dirty' && (
                            <button
                              onClick={(e) => { e.stopPropagation(); handleUpdateStatus(room.id, 'clean'); }}
                              className="px-2 py-0.5 rounded bg-emerald-600 text-white font-bold text-[9px]"
                              title="Đánh dấu đã dọn"
                            >
                              Xong
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    // ==========================================
    // SCREEN 5: PAYMENTS (THU TIỀN & SỔ QUỸ)
    // ==========================================
    function PaymentsScreen({ data, onOpenNewPayment, showToast }) {
      const payments = data?.payments || [];

      const totals = useMemo(() => {
        let totalThu = 0;
        let daHoanTien = 0;
        payments.forEach(p => {
          if (p.amount > 0) totalThu += p.amount;
          else daHoanTien += Math.abs(p.amount);
        });
        const thucThu = totalThu - daHoanTien;
        return { totalThu, daHoanTien, thucThu };
      }, [payments]);

      const handleExportExcel = () => {
        window.open('/api/export/payments', '_blank');
        showToast('📥 Đang tải file Excel danh sách phiếu thu...');
      };

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="p-5 rounded-3xl bg-white border border-slate-200/80 shadow-sm flex flex-col justify-between">
              <span className="text-xs font-bold text-slate-500 uppercase flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-emerald-500"></span> Tổng thu
              </span>
              <div className="mt-3">
                <div className="text-2xl sm:text-3xl font-black text-slate-900">{formatVND(totals.totalThu)}</div>
                <div className="text-xs text-slate-400 mt-1">{payments.length} phiếu thu</div>
              </div>
            </div>

            <div className="p-5 rounded-3xl bg-white border border-slate-200/80 shadow-sm flex flex-col justify-between">
              <span className="text-xs font-bold text-slate-500 uppercase flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-rose-500"></span> Đã hoàn tiền
              </span>
              <div className="mt-3">
                <div className="text-2xl sm:text-3xl font-black text-rose-600">{formatVND(totals.daHoanTien)}</div>
                <div className="text-xs text-slate-400 mt-1">1 phiếu hoàn trả</div>
              </div>
            </div>

            <div className="p-5 rounded-3xl bg-gradient-to-br from-teal-700 to-indigo-800 text-white shadow-md flex flex-col justify-between">
              <span className="text-xs font-bold text-teal-200 uppercase flex items-center gap-1.5">
                <span>💳 Thực thu</span>
              </span>
              <div className="mt-3">
                <div className="text-2xl sm:text-3xl font-black">{formatVND(totals.thucThu)}</div>
                <div className="text-xs text-teal-100 mt-1">Nhiều nhất: OTA thu hộ</div>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200/80 shadow-sm space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <div>
                <h3 className="font-extrabold text-xl text-slate-900">Thu tiền</h3>
                <p className="text-xs text-slate-400">Mọi phiếu đặt cọc, thanh toán và hoàn tiền của các đơn</p>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={handleExportExcel}
                  className="px-3.5 py-2 rounded-xl bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 font-bold text-xs shadow-sm flex items-center gap-1.5"
                >
                  <span>📥 Xuất Excel</span>
                </button>
                <button
                  onClick={onOpenNewPayment}
                  className="px-3.5 py-2 rounded-xl bg-teal-700 hover:bg-teal-800 text-white font-bold text-xs shadow-md shadow-teal-700/20 flex items-center gap-1.5"
                >
                  <span>➕ Lập phiếu thu</span>
                </button>
              </div>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-xs text-left border-collapse">
                <thead>
                  <tr className="border-b border-slate-200 text-slate-400 font-bold uppercase text-[10px]">
                    <th className="py-3 px-2">Ngày thu</th>
                    <th className="py-3 px-2">Mã đặt</th>
                    <th className="py-3 px-2">Khách</th>
                    <th className="py-3 px-2">Phòng · Cơ sở</th>
                    <th className="py-3 px-2">Loại</th>
                    <th className="py-3 px-2">Phương thức</th>
                    <th className="py-3 px-2 text-right">Số tiền</th>
                    <th className="py-3 px-2">Người thu</th>
                    <th className="py-3 px-2">Ghi chú</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 font-medium">
                  {payments.map(p => (
                    <tr key={p.id} className="hover:bg-slate-50/60">
                      <td className="py-3 px-2 text-slate-500 whitespace-nowrap">{p.date}</td>

                      <td className="py-3 px-2 text-slate-400 italic max-w-xs truncate">{p.notes}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }
