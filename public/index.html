    // ==========================================
    // SCREEN 8: PROPERTIES & ROOMS (CƠ SỞ & PHÒNG)
    // ==========================================
    function PropertiesScreen({ data, currentUser, hasPermission, onRefresh, showToast }) {
      const properties = data?.properties || [];
      const [filterType, setFilterType] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [activeMenuPropId, setActiveMenuPropId] = useState(null);

      // Modals
      const [showModal, setShowModal] = useState(false);
      const [editingProperty, setEditingProperty] = useState(null);
      const [deletingProperty, setDeletingProperty] = useState(null);
      const [managingRoomsProperty, setManagingRoomsProperty] = useState(null);

      // Close dropdown when clicking outside
      useEffect(() => {
        const handleClickOutside = () => setActiveMenuPropId(null);
        window.addEventListener('click', handleClickOutside);
        return () => window.removeEventListener('click', handleClickOutside);
      }, []);

      // Filter properties
      const filteredProperties = useMemo(() => {
        let list = properties;
        if (currentUser?.propertyScope && currentUser.propertyScope !== 'all') {
          list = list.filter(p => p.id === currentUser.propertyScope);
        }
        if (filterType !== 'all') {
          list = list.filter(p => p.type === filterType);
        }
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase().trim();
          list = list.filter(p =>
            (p.name && p.name.toLowerCase().includes(q)) ||
            (p.address && p.address.toLowerCase().includes(q)) ||
            (p.phone && p.phone.includes(q))
          );
        }
        return list;
      }, [properties, filterType, searchQuery, currentUser]);

      const canAdd = currentUser?.role === 'admin' || (hasPermission && hasPermission('property', 'add'));
      const canEdit = currentUser?.role === 'admin' || (hasPermission && hasPermission('property', 'edit'));
      const canDelete = currentUser?.role === 'admin' || (hasPermission && hasPermission('property', 'delete'));

      return (
        <div className="space-y-6">
          {/* Header & Action */}
          <div className="flex flex-wrap items-center justify-between gap-4">
            <div>
              <h3 className="font-extrabold text-xl text-slate-900">Cơ sở & phòng</h3>
              <p className="text-xs text-slate-400">Khai báo khách sạn / homestay, loại phòng, bảng giá và danh sách phòng</p>
            </div>
            {canAdd && (
              <button
                onClick={() => {
                  setEditingProperty(null);
                  setShowModal(true);
                }}
                className="px-4 py-2.5 rounded-xl bg-teal-700 hover:bg-teal-800 text-white font-bold text-xs shadow-md shadow-teal-700/20 flex items-center gap-1.5 transition transform active:scale-95"
              >
                <span>➕ Thêm cơ sở</span>
              </button>
            )}
          </div>

          {/* Filter Bar */}
          <div className="flex flex-wrap items-center gap-3">
            <select
              value={filterType}
              onChange={(e) => setFilterType(e.target.value)}
              className="px-3.5 py-2.5 rounded-2xl bg-white border border-slate-200 text-xs font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-teal-500/20 shadow-sm"
            >
              <option value="all">Tất cả loại hình</option>
              <option value="Khách sạn">Khách sạn</option>
              <option value="Homestay">Homestay</option>
              <option value="Villa">Villa</option>
              <option value="Resort">Resort</option>
              <option value="Căn hộ">Căn hộ</option>
            </select>

            <div className="flex-1 min-w-[240px] relative">
              <span className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 text-xs">
                🔍
              </span>
              <input
                type="text"
                placeholder="Tìm tên cơ sở, địa chỉ, số phòng..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full pl-9 pr-4 py-2.5 rounded-2xl bg-white border border-slate-200 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-500/20 shadow-sm"
              />
            </div>
          </div>

          {/* Grid of Property Cards */}
          {filteredProperties.length === 0 ? (
            <div className="bg-white rounded-3xl p-12 text-center border border-slate-200/80 shadow-sm">
              <div className="text-4xl mb-3">🏨</div>
              <h4 className="font-bold text-base text-slate-800">Không tìm thấy cơ sở phù hợp</h4>
              <p className="text-xs text-slate-400 mt-1">Vui lòng thử tìm kiếm khác hoặc thêm cơ sở lưu trú mới.</p>
              {canAdd && (
                <button
                  onClick={() => {
                    setEditingProperty(null);
                    setShowModal(true);
                  }}
                  className="mt-4 px-4 py-2 rounded-xl bg-teal-700 text-white font-bold text-xs"
                >
                  ➕ Thêm cơ sở ngay
                </button>
              )}
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {filteredProperties.map(p => {
                const pRooms = (data?.rooms || []).filter(r => r.propertyId === p.id);
                const pTypes = (data?.roomTypes || []).filter(rt => rt.propertyId === p.id);
                const activeBookings = (data?.bookings || []).filter(b => b.propertyId === p.id && ['checked_in', 'confirmed'].includes(b.status));
                const occupancyRate = pRooms.length > 0 ? Math.round((activeBookings.length / pRooms.length) * 100 * 10) / 10 : (p.occupancyRate || 0);
                const minPrice = pTypes.length > 0 ? Math.min(...pTypes.map(t => t.priceWeekday || 99999999)) : (p.priceFrom || 500000);

                let iconBg = 'bg-teal-600';
                let iconChar = '🏡';
                if (p.type === 'Khách sạn') {
                  iconBg = 'bg-sky-600';
                  iconChar = '🏨';
                } else if (p.type === 'Villa') {
                  iconBg = 'bg-indigo-600';
                  iconChar = '🏰';
                } else if (p.type === 'Resort') {
                  iconBg = 'bg-emerald-600';
                  iconChar = '🌴';
                }

                return (
                  <div key={p.id} className="bg-white rounded-3xl p-6 border border-slate-200/80 shadow-sm space-y-4 hover:shadow-md transition relative flex flex-col justify-between">
                    <div>
                      {/* Top Header */}
                      <div className="flex items-start justify-between gap-3">
                        <div className="flex items-center gap-3">
                          <div className={`w-11 h-11 rounded-2xl ${iconBg} text-white flex items-center justify-center font-bold text-xl shadow-sm shrink-0`}>
                            {iconChar}
                          </div>
                          <div>
                            <h4 className="font-extrabold text-base text-slate-900 leading-snug">{p.name}</h4>
                            <p className="text-[11px] text-slate-400 mt-0.5 line-clamp-1">{p.type} · {p.address || 'Chưa cập nhật địa chỉ'}</p>
                          </div>
                        </div>

                        {/* 3-dots Menu Button */}
                        {(canEdit || canDelete) && (
                          <div className="relative" onClick={(e) => e.stopPropagation()}>
                            <button
                              onClick={() => setActiveMenuPropId(activeMenuPropId === p.id ? null : p.id)}
                              className="w-8 h-8 rounded-xl hover:bg-slate-100 flex items-center justify-center text-slate-500 font-bold transition text-base"
                              title="Tùy chọn cơ sở"
                            >
                              ⋮
                            </button>

                            {/* Dropdown Menu */}
                            {activeMenuPropId === p.id && (
                              <div className="absolute right-0 top-9 z-30 w-48 bg-white rounded-2xl shadow-xl border border-slate-100 py-1.5 text-xs animate-in fade-in zoom-in-95 duration-100">
                                {canEdit && (
                                  <button
                                    onClick={() => {
                                      setActiveMenuPropId(null);
                                      setEditingProperty(p);
                                      setShowModal(true);
                                    }}
                                    className="w-full text-left px-3.5 py-2 hover:bg-teal-50 text-slate-700 hover:text-teal-800 font-semibold flex items-center gap-2"
                                  >
                                    <span>✏️</span> Chỉnh sửa thông tin
                                  </button>
                                )}
                                <button
                                  onClick={() => {
                                    setActiveMenuPropId(null);
                                    setManagingRoomsProperty(p);
                                  }}
                                  className="w-full text-left px-3.5 py-2 hover:bg-teal-50 text-slate-700 hover:text-teal-800 font-semibold flex items-center gap-2"
                                >
                                  <span>🛏️</span> Quản lý phòng ({pRooms.length})
                                </button>
                                {canDelete && (
                                  <button
                                    onClick={() => {
                                      setActiveMenuPropId(null);
                                      setDeletingProperty(p);
                                    }}
                                    className="w-full text-left px-3.5 py-2 hover:bg-rose-50 text-rose-600 font-semibold flex items-center gap-2 border-t border-slate-100 mt-1 pt-1.5"
                                  >
                                    <span>🗑️</span> Xoá cơ sở này
                                  </button>
                                )}
                              </div>
                            )}
                          </div>
                        )}
                      </div>

                      {/* Metrics 4-column */}
                      <div className="grid grid-cols-4 gap-2 py-3 mt-3 border-y border-slate-100 text-center text-xs">
                        <div>
                          <div className="text-slate-400 text-[10px]">Số phòng</div>
                          <div className="font-extrabold text-slate-800 text-base">{pRooms.length}</div>
                        </div>
                        <div>
                          <div className="text-slate-400 text-[10px]">Loại phòng</div>
                          <div className="font-extrabold text-slate-800 text-base">{pTypes.length}</div>
                        </div>
                        <div>
                          <div className="text-slate-400 text-[10px]">Công suất</div>
                          <div className="font-extrabold text-emerald-600 text-base">{occupancyRate}%</div>
                        </div>
                        <div>
                          <div className="text-slate-400 text-[10px]">Giá từ</div>
                          <div className="font-extrabold text-teal-800 text-sm">
                            {minPrice < 1000000 ? `${Math.round(minPrice / 1000)}k` : `${(minPrice / 1000000).toFixed(1)}tr`}
                          </div>
                        </div>
                      </div>

                      {/* Room Types Badges */}
                      <div className="space-y-1.5 pt-3">
                        <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Loại phòng:</div>
                        <div className="flex flex-wrap gap-1.5">
                          {pTypes.length === 0 ? (
                            <span className="text-xs text-slate-400 italic">Chưa có loại phòng nào</span>
                          ) : (
                            pTypes.map(pt => {
                              const countInType = pRooms.filter(r => r.roomTypeId === pt.id).length;
                              return (
                                <span key={pt.id} className="px-2.5 py-1 rounded-xl bg-slate-100 text-slate-700 text-[11px] font-semibold flex items-center gap-1">
                                  <span>{pt.name}</span>
                                  <span className="w-4 h-4 rounded-full bg-teal-100 text-teal-800 text-[9px] font-extrabold flex items-center justify-center">
                                    {countInType}
                                  </span>
                                </span>
                              );
                            })
                          )}
                        </div>
                      </div>
                    </div>

                    {/* Bottom Info */}
                    <div className="pt-3 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
                      <div className="flex items-center gap-1.5">
                        <span>🕒</span>
                        <span>Nhận: <b>{p.checkIn || '14:00'}</b> · Trả: <b>{p.checkOut || '12:00'}</b></span>
                      </div>
                      {p.phone && (
                        <div className="flex items-center gap-1 text-slate-500 font-semibold">
                          <span>📞</span>
                          <span>{p.phone}</span>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* Footer count */}
          <div className="text-xs text-slate-400 text-right pt-2 font-medium">
            Hiển thị {filteredProperties.length} / {properties.length} cơ sở
          </div>

          {/* Modal 1: Add / Edit Property */}
          {showModal && (
            <PropertyFormModal
              property={editingProperty}
              onClose={() => {
                setShowModal(false);
                setEditingProperty(null);
              }}
              onSaveSuccess={() => {
                setShowModal(false);
                setEditingProperty(null);
                onRefresh();
                showToast(editingProperty ? 'Đã cập nhật cơ sở thành công!' : 'Đã thêm cơ sở mới thành công!');
              }}
              showToast={showToast}
            />
          )}

          {/* Modal 2: Delete Property Confirmation */}
          {deletingProperty && (
            <DeletePropertyModal
              property={deletingProperty}
              data={data}
              onClose={() => setDeletingProperty(null)}
              onDeleteSuccess={() => {
                setDeletingProperty(null);
                onRefresh();
                showToast(`Đã xoá cơ sở "${deletingProperty.name}" thành công!`);
              }}
              showToast={showToast}
            />
          )}

          {/* Modal 3: Manage Rooms & Room Types */}
          {managingRoomsProperty && (
            <ManageRoomsModal
              property={managingRoomsProperty}
              data={data}
              onClose={() => setManagingRoomsProperty(null)}
              onRefresh={onRefresh}
              showToast={showToast}
            />
          )}
        </div>
      );
    }

    // ==========================================
    // MODAL: THÊM / SỬA CƠ SỞ (ADD / EDIT PROPERTY)
    // ==========================================
    function PropertyFormModal({ property, onClose, onSaveSuccess, showToast }) {
      const isEdit = !!property;
      const [name, setName] = useState(property?.name || '');
      const [type, setType] = useState(property?.type || 'Homestay');
      const [address, setAddress] = useState(property?.address || '');
      const [phone, setPhone] = useState(property?.phone || '');
      const [checkIn, setCheckIn] = useState(property?.checkIn || '14:00');
      const [checkOut, setCheckOut] = useState(property?.checkOut || '12:00');
      const [priceFrom, setPriceFrom] = useState(property?.priceFrom || 500000);

      // Quick room init (only on Add new)
      const [initRooms, setInitRooms] = useState(!isEdit);
      const [rtName, setRtName] = useState('Phòng Tiêu Chuẩn');
      const [rtCapacity, setRtCapacity] = useState(2);
      const [rtPriceWeekday, setRtPriceWeekday] = useState(500000);
      const [rtPriceWeekend, setRtPriceWeekend] = useState(700000);
      const [roomsCount, setRoomsCount] = useState(3);

      const [saving, setSaving] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!name.trim()) {
          showToast('Vui lòng nhập tên cơ sở', 'error');
          return;
        }

        setSaving(true);
        try {
          const payload = {
            name: name.trim(),
            type,
            address: address.trim(),
            phone: phone.trim(),
            checkIn,
            checkOut,
            priceFrom: Number(priceFrom) || 0
          };

          if (!isEdit && initRooms && rtName.trim()) {
            payload.initialRoomType = {
              name: rtName.trim(),
              capacity: Number(rtCapacity) || 2,
              priceWeekday: Number(rtPriceWeekday) || 0,
              priceWeekend: Number(rtPriceWeekend) || 0,
              roomsCount: Number(roomsCount) || 1
            };
          }

          const url = isEdit ? `/api/properties/${property.id}` : '/api/properties';
          const method = isEdit ? 'PUT' : 'POST';

          const res = await authFetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const json = await res.json();
          if (res.ok) {
            onSaveSuccess();
          } else {
            showToast(json.error || 'Có lỗi xảy ra', 'error');
          }
        } catch (err) {
          showToast('Lỗi kết nối: ' + err.message, 'error');
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-white w-full max-w-lg rounded-3xl shadow-2xl border border-slate-100 overflow-hidden my-8 animate-in fade-in zoom-in-95 duration-150">
            {/* Modal Header */}
            <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-gradient-to-r from-teal-50 to-white">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-teal-600 text-white flex items-center justify-center font-bold text-base shadow-sm">
                  {isEdit ? '✏️' : '🏨'}
                </div>
                <div>
                  <h3 className="font-extrabold text-base text-slate-900">
                    {isEdit ? 'Chỉnh sửa thông tin cơ sở' : 'Thêm cơ sở lưu trú mới'}
                  </h3>
                  <p className="text-[11px] text-slate-400">
                    {isEdit ? `Mã cơ sở: ${property.id}` : 'Khai báo khách sạn, homestay, villa nghỉ dưỡng'}
                  </p>
                </div>
              </div>
              <button
                onClick={onClose}
                className="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-400 hover:text-slate-700 font-bold transition"
              >
                ✕
              </button>
            </div>

            {/* Modal Form */}
            <form onSubmit={handleSubmit} className="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div className="sm:col-span-2">
                  <label className="block text-xs font-bold text-slate-700 mb-1">
                    Tên cơ sở <span className="text-rose-500">*</span>
                  </label>
                  <input
                    type="text"
                    required
                    placeholder="VD: Homestay Sương Mai, Villa Biển An Bàng..."
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-teal-500/20"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Loại hình lưu trú</label>
                  <select
                    value={type}
                    onChange={(e) => setType(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-teal-500/20 bg-white"
                  >
                    <option value="Homestay">Homestay</option>
                    <option value="Khách sạn">Khách sạn</option>
                    <option value="Villa">Villa biệt thự</option>
                    <option value="Resort">Resort nghỉ dưỡng</option>
                    <option value="Căn hộ">Căn hộ / Condotel</option>
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Số điện thoại liên hệ</label>
                  <input
                    type="text"
                    placeholder="VD: 0912345678"
                    value={phone}
                    onChange={(e) => setPhone(e.target.value)}

    // ==========================================
    // MODAL: XÁC NHẬN XOÁ CƠ SỞ (DELETE PROPERTY)
    // ==========================================
    function DeletePropertyModal({ property, data, onClose, onDeleteSuccess, showToast }) {
      const [deleting, setDeleting] = useState(false);
      const [forceConfirmed, setForceConfirmed] = useState(false);

      const pRooms = (data?.rooms || []).filter(r => r.propertyId === property.id);
      const activeBookings = (data?.bookings || []).filter(b => b.propertyId === property.id && !['cancelled', 'checked_out'].includes(b.status));
      const hasActiveBookings = activeBookings.length > 0;

      const handleDelete = async () => {
        if (hasActiveBookings && !forceConfirmed) {
          showToast('Vui lòng tích xác nhận xoá ép buộc các đơn đang hoạt động!', 'error');
          return;
        }

        setDeleting(true);
        try {
          const url = `/api/properties/${property.id}${forceConfirmed ? '?force=true' : ''}`;
          const res = await authFetch(url, { method: 'DELETE' });
          const json = await res.json();

          if (res.ok) {
            onDeleteSuccess();
          } else {
            showToast(json.error || 'Không thể xoá cơ sở', 'error');
          }
        } catch (err) {
          showToast('Lỗi kết nối: ' + err.message, 'error');
        } finally {
          setDeleting(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white w-full max-w-md rounded-3xl shadow-2xl border border-slate-100 p-6 space-y-4 animate-in fade-in zoom-in-95 duration-150">
            <div className="w-12 h-12 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center text-2xl mx-auto shadow-sm">
              ⚠️
            </div>

            <div className="text-center">
              <h3 className="font-extrabold text-lg text-slate-900">Xác nhận xoá cơ sở</h3>
              <p className="text-xs text-slate-500 mt-1">
                Bạn có chắc chắn muốn xoá cơ sở <b className="text-slate-800">{property.name}</b>?
              </p>
            </div>

            <div className="p-3.5 rounded-2xl bg-slate-50 border border-slate-100 text-xs space-y-1.5 text-slate-600">
              <div>📍 <b>Địa chỉ:</b> {property.address || 'Không có'}</div>
              <div>🛏️ <b>Phòng trực thuộc:</b> {pRooms.length} phòng sẽ bị xoá cùng cơ sở này.</div>
            </div>

            {hasActiveBookings ? (
              <div className="p-3.5 rounded-2xl bg-rose-50 border border-rose-200 text-xs space-y-2">
                <div className="font-bold text-rose-800 flex items-center gap-1.5">
                  <span>🚨</span> Cảnh báo: Đang có {activeBookings.length} đơn đặt phòng hoạt động!
                </div>
                <p className="text-rose-700 text-[11px]">
                  Cơ sở này đang có các đơn khách đang ở hoặc đã xác nhận đặt phòng. Nếu tiếp tục, toàn bộ dữ liệu này sẽ bị huỷ bỏ hoàn toàn.
                </p>
                <label className="flex items-center gap-2 cursor-pointer pt-1">
                  <input
                    type="checkbox"
                    checked={forceConfirmed}
                    onChange={(e) => setForceConfirmed(e.target.checked)}
                    className="rounded text-rose-600 focus:ring-rose-500"
                  />
                  <span className="text-[11px] font-bold text-rose-900">
                    Tôi hiểu và đồng ý xoá ép buộc cơ sở này
                  </span>
                </label>
              </div>
            ) : null}

            <div className="flex items-center gap-3 pt-2">
              <button
                type="button"
                onClick={onClose}
                className="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-700 font-bold text-xs hover:bg-slate-50"
              >
                Hủy bỏ
              </button>
              <button
                type="button"
                disabled={deleting || (hasActiveBookings && !forceConfirmed)}
                onClick={handleDelete}
                className="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs shadow-md shadow-rose-600/20 disabled:opacity-50 flex items-center justify-center gap-1.5"
              >
                {deleting ? (
                  <span>Đang xoá...</span>
                ) : (
                  <span>🗑️ Xoá vĩnh viễn</span>
                )}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MODAL: QUẢN LÝ PHÒNG & BẢNG GIÁ (MANAGE ROOMS)
    // ==========================================
    function ManageRoomsModal({ property, data, onClose, onRefresh, showToast }) {
      const [activeTab, setActiveTab] = useState('rooms');
      const [showAddRoom, setShowAddRoom] = useState(false);
      const [showAddType, setShowAddType] = useState(false);

      // New Room State
      const [roomName, setRoomName] = useState('');
      const [roomTypeId, setRoomTypeId] = useState('');
      const [roomFloor, setRoomFloor] = useState(1);

      // New Room Type State
      const [typeName, setTypeName] = useState('');
      const [typeCapacity, setTypeCapacity] = useState(2);
      const [typePriceWeekday, setTypePriceWeekday] = useState(500000);
      const [typePriceWeekend, setTypePriceWeekend] = useState(700000);

      const pRooms = (data?.rooms || []).filter(r => r.propertyId === property.id);
      const pTypes = (data?.roomTypes || []).filter(rt => rt.propertyId === property.id);

      useEffect(() => {
        if (pTypes.length > 0 && !roomTypeId) {
          setRoomTypeId(pTypes[0].id);
        }
      }, [pTypes]);

      // Add Room
      const handleAddRoom = async (e) => {
        e.preventDefault();
        if (!roomName.trim() || !roomTypeId) {
          showToast('Vui lòng nhập tên phòng và chọn loại phòng', 'error');
          return;
        }

        try {
          const res = await authFetch('/api/rooms', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: roomName.trim(),
              propertyId: property.id,
              roomTypeId,
              floor: Number(roomFloor) || 1
            })
          });
          const json = await res.json();
          if (res.ok) {
            showToast(`Đã thêm phòng ${roomName}!`);
            setRoomName('');
            setShowAddRoom(false);
            onRefresh();
          } else {
            showToast(json.error || 'Lỗi thêm phòng', 'error');
          }
        } catch (err) {
          showToast('Lỗi: ' + err.message, 'error');
        }
      };

      // Delete Room
      const handleDeleteRoom = async (roomId, rName) => {
        if (!confirm(`Bạn có chắc muốn xoá phòng "${rName}"?`)) return;
        try {
          const res = await authFetch(`/api/rooms/${roomId}`, { method: 'DELETE' });
          const json = await res.json();
          if (res.ok) {
            showToast(`Đã xoá phòng ${rName}!`);
            onRefresh();
          } else {
            showToast(json.error || 'Lỗi xoá phòng', 'error');
          }
        } catch (err) {
          showToast('Lỗi: ' + err.message, 'error');
        }
      };

      // Add Room Type
      const handleAddType = async (e) => {
        e.preventDefault();
        if (!typeName.trim()) {
          showToast('Vui lòng nhập tên loại phòng', 'error');
          return;
        }

        try {
          const res = await authFetch('/api/room-types', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: typeName.trim(),
              propertyId: property.id,
              capacity: Number(typeCapacity) || 2,
              priceWeekday: Number(typePriceWeekday) || 0,
              priceWeekend: Number(typePriceWeekend) || 0
            })
          });
          const json = await res.json();
          if (res.ok) {
            showToast(`Đã thêm loại phòng ${typeName}!`);
            setTypeName('');
            setShowAddType(false);
            onRefresh();
          } else {
            showToast(json.error || 'Lỗi thêm loại phòng', 'error');
          }
        } catch (err) {
          showToast('Lỗi: ' + err.message, 'error');
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-white w-full max-w-2xl rounded-3xl shadow-2xl border border-slate-100 overflow-hidden my-8 animate-in fade-in zoom-in-95 duration-150">
            {/* Header */}
            <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-gradient-to-r from-teal-50 to-white">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-teal-600 text-white flex items-center justify-center font-bold text-base shadow-sm">
                  🛏️
                </div>
                <div>
                  <h3 className="font-extrabold text-base text-slate-900">
                    Quản lý phòng: {property.name}
                  </h3>
                  <p className="text-[11px] text-slate-400">
                    {pRooms.length} phòng · {pTypes.length} loại phòng
                  </p>
                </div>
              </div>
              <button
                onClick={onClose}
                className="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-400 hover:text-slate-700 font-bold transition"
              >
                ✕
              </button>
            </div>

            {/* Tabs */}
            <div className="px-6 pt-3 border-b border-slate-100 flex gap-4 text-xs font-bold">
              <button
                onClick={() => setActiveTab('rooms')}
                className={`pb-2.5 border-b-2 transition ${
                  activeTab === 'rooms' ? 'border-teal-700 text-teal-800' : 'border-transparent text-slate-400 hover:text-slate-700'
                }`}
              >
                Danh sách phòng ({pRooms.length})
              </button>
              <button
                onClick={() => setActiveTab('types')}
                className={`pb-2.5 border-b-2 transition ${
                  activeTab === 'types' ? 'border-teal-700 text-teal-800' : 'border-transparent text-slate-400 hover:text-slate-700'
                }`}
              >
                Loại phòng & Bảng giá ({pTypes.length})
              </button>
            </div>

            {/* Content */}
            <div className="p-6 max-h-[70vh] overflow-y-auto space-y-4">
              {activeTab === 'rooms' && (
                <div>
                  <div className="flex items-center justify-between mb-3">
                    <span className="text-xs font-bold text-slate-700">Các phòng đang hoạt động:</span>
                    <button
                      onClick={() => setShowAddRoom(!showAddRoom)}
                      className="px-3 py-1.5 rounded-lg bg-teal-700 text-white font-bold text-xs flex items-center gap-1"
                    >
                      {showAddRoom ? '✕ Đóng form' : '➕ Thêm phòng'}
                    </button>
                  </div>

                  {/* Add Room Inline Form */}
                  {showAddRoom && (
                    <form onSubmit={handleAddRoom} className="p-3.5 mb-4 rounded-2xl bg-teal-50/70 border border-teal-100 grid grid-cols-1 sm:grid-cols-4 gap-2 text-xs">
                      <div>
                        <span className="font-bold text-teal-900 block mb-1">Số / Tên phòng</span>
                        <input
                          type="text"
                          required
                          placeholder="VD: 101, 202, VIP1"
                          value={roomName}
                          onChange={(e) => setRoomName(e.target.value)}
                          className="w-full px-2.5 py-1.5 rounded-lg bg-white border border-teal-200 text-xs font-semibold"
                        />
                      </div>
                      <div>
                        <span className="font-bold text-teal-900 block mb-1">Loại phòng</span>
                        <select
                          value={roomTypeId}
                          onChange={(e) => setRoomTypeId(e.target.value)}
                          className="w-full px-2.5 py-1.5 rounded-lg bg-white border border-teal-200 text-xs font-semibold"
                        >
                          {pTypes.map(t => (
                            <option key={t.id} value={t.id}>{t.name}</option>
                          ))}
                        </select>
                      </div>
                      <div>
                        <span className="font-bold text-teal-900 block mb-1">Tầng</span>
                        <input
                          type="number"
                          value={roomFloor}
                          onChange={(e) => setRoomFloor(e.target.value)}
                          className="w-full px-2.5 py-1.5 rounded-lg bg-white border border-teal-200 text-xs font-semibold"
                        />
                      </div>
                      <div className="flex items-end">
                        <button
                          type="submit"
                          className="w-full py-1.5 rounded-lg bg-teal-800 text-white font-bold text-xs"
                        >
                          💾 Lưu phòng
                        </button>
                      </div>
                    </form>
                  )}

                  {/* Rooms Grid */}
                  <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2.5">
                    {pRooms.map(r => {
                      const rType = pTypes.find(t => t.id === r.roomTypeId);
                      return (
                        <div key={r.id} className="p-3 rounded-2xl bg-slate-50 border border-slate-200/80 flex items-center justify-between">
                          <div>
                            <div className="font-extrabold text-sm text-slate-800">{r.name}</div>
                            <div className="text-[10px] text-slate-400 truncate max-w-[100px]">{rType?.name || 'Phòng'}</div>
                          </div>
                          <button
                            onClick={() => handleDeleteRoom(r.id, r.name)}
                            className="w-6 h-6 rounded-lg hover:bg-rose-100 text-slate-300 hover:text-rose-600 flex items-center justify-center transition text-xs"
                            title="Xoá phòng"
                          >
                            🗑️
                          </button>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {activeTab === 'types' && (
                <div>
                  <div className="flex items-center justify-between mb-3">
                    <span className="text-xs font-bold text-slate-700">Các loại phòng & bảng giá:</span>
                    <button
                      onClick={() => setShowAddType(!showAddType)}
                      className="px-3 py-1.5 rounded-lg bg-teal-700 text-white font-bold text-xs flex items-center gap-1"
                    >
                      {showAddType ? '✕ Đóng form' : '➕ Thêm loại phòng'}
                    </button>
                  </div>

                  {/* Add Type Form */}
                  {showAddType && (
                    <form onSubmit={handleAddType} className="p-3.5 mb-4 rounded-2xl bg-teal-50/70 border border-teal-100 grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
                      <div className="col-span-2">
                        <span className="font-bold text-teal-900 block mb-1">Tên loại phòng</span>
                        <input
                          type="text"
                          required
                          placeholder="VD: Deluxe Ban Công View Núi"
                          value={typeName}
                          onChange={(e) => setTypeName(e.target.value)}
                          className="w-full px-2.5 py-1.5 rounded-lg bg-white border border-teal-200 text-xs font-semibold"
                        />
                      </div>
                      <div>
                        <span className="font-bold text-teal-900 block mb-1">Giá ngày thường</span>
                        <input
                          type="number"
                          value={typePriceWeekday}
                          onChange={(e) => setTypePriceWeekday(e.target.value)}
                          className="w-full px-2.5 py-1.5 rounded-lg bg-white border border-teal-200 text-xs font-semibold"
                        />
                      </div>
                      <div>
                        <span className="font-bold text-teal-900 block mb-1">Giá cuối tuần</span>
                        <input
                          type="number"
                          value={typePriceWeekend}
                          onChange={(e) => setTypePriceWeekend(e.target.value)}
                          className="w-full px-2.5 py-1.5 rounded-lg bg-white border border-teal-200 text-xs font-semibold"
                        />
                      </div>
                      <div className="col-span-2 sm:col-span-4 flex justify-end">
                        <button
                          type="submit"
                          className="px-4 py-1.5 rounded-lg bg-teal-800 text-white font-bold text-xs"
                        >
                          💾 Lưu loại phòng
                        </button>
                      </div>
                    </form>
                  )}

                  {/* Types List */}
                  <div className="space-y-2">
                    {pTypes.map(t => (
                      <div key={t.id} className="p-3.5 rounded-2xl bg-slate-50 border border-slate-200/80 flex items-center justify-between text-xs">
                        <div>
                          <div className="font-extrabold text-sm text-slate-800">{t.name}</div>
                          <div className="text-[11px] text-slate-400 mt-0.5">
                            Sức chứa: <b>{t.capacity || 2} khách</b>
                          </div>
                        </div>

    // ==========================================
    // MODAL: NEW SINGLE BOOKING
    // ==========================================
    function NewBookingModal({ data, initialData, onClose, onSuccess }) {
      const [propertyId, setPropertyId] = useState(initialData?.propertyId || data?.properties[0]?.id || '');
      const [roomId, setRoomId] = useState(initialData?.roomId || '');
      const [customerName, setCustomerName] = useState('');
      const [customerPhone, setCustomerPhone] = useState('');
      const [checkInDate, setCheckInDate] = useState(initialData?.checkInDate || '2026-11-13');
      const [checkOutDate, setCheckOutDate] = useState(initialData?.checkOutDate || '2026-11-15');
      const [guestsCount, setGuestsCount] = useState(2);
      const [source, setSource] = useState('direct');
      const [status, setStatus] = useState('confirmed');
      const [deposit, setDeposit] = useState(0);
      const [paymentMethod, setPaymentMethod] = useState('cash');
      const [notes, setNotes] = useState('');
      const [submitting, setSubmitting] = useState(false);

      const currentRoom = (data?.rooms || []).find(r => r.id === roomId);
      const currentRoomType = (data?.roomTypes || []).find(rt => rt.id === currentRoom?.roomTypeId);
      const propRooms = (data?.rooms || []).filter(r => r.propertyId === propertyId);

      useEffect(() => {
        if (!roomId && propRooms.length) {
          setRoomId(propRooms[0].id);
        }
      }, [propertyId]);

      const computedRates = useMemo(() => {
        if (!currentRoomType || !checkInDate || !checkOutDate) return [];
        const weekendNights = data?.settings?.weekendNights || ['fri', 'sat'];
        const start = new Date(checkInDate);
        const end = new Date(checkOutDate);
        const dayNames = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
        const dayCodes = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
        const rates = [];

        let cur = new Date(start);
        while (cur < end) {
          const code = dayCodes[cur.getDay()];
          const isWeekend = weekendNights.includes(code);
          const rate = isWeekend ? (currentRoomType.priceWeekend || currentRoomType.priceWeekday) : currentRoomType.priceWeekday;
          rates.push({
            date: cur.toISOString().split('T')[0],
            dayName: dayNames[cur.getDay()],
            isWeekend,
            rate
          });
          cur.setDate(cur.getDate() + 1);
        }
        return rates;
      }, [currentRoomType, checkInDate, checkOutDate, data]);

      const roomTotal = computedRates.reduce((s, r) => s + r.rate, 0);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!customerName.trim() || !customerPhone.trim()) {
          alert('Vui lòng nhập tên và số điện thoại khách');
          return;
        }
        setSubmitting(true);
        try {
          const res = await authFetch('/api/bookings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              propertyId,
              roomId,
              customerName,
              customerPhone,
              checkInDate,
              checkOutDate,
              guestsCount: Number(guestsCount),
              source,
              status,
              deposit: Number(deposit) || 0,
              paymentMethod,
              notes
            })
          });
          const json = await res.json();
          if (res.ok) {
            onSuccess();
          } else {
            alert('Lỗi: ' + json.error);
          }
        } catch (err) {
          alert('Lỗi kết nối: ' + err.message);
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-white rounded-3xl max-w-xl w-full p-6 shadow-2xl space-y-4 my-8">
            <div className="flex items-center justify-between pb-3 border-b border-slate-100">
              <h3 className="font-extrabold text-lg text-slate-900 flex items-center gap-2">
                <span>➕ Tạo Đặt Phòng Mới</span>
              </h3>
              <button onClick={onClose} className="p-1 rounded-xl hover:bg-slate-100 text-slate-400">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Cơ sở</label>
                  <select
                    value={propertyId}
                    onChange={(e) => setPropertyId(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200"
                  >
                    {(data?.properties || []).map(p => (
                      <option key={p.id} value={p.id}>{p.name}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Chọn phòng</label>
                  <select
                    value={roomId}
                    onChange={(e) => setRoomId(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200"
                  >
                    {propRooms.map(r => (
                      <option key={r.id} value={r.id}>{r.name} ({r.floor})</option>
                    ))}
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Ngày nhận phòng</label>
                  <input
                    type="date"
                    value={checkInDate}
                    onChange={(e) => setCheckInDate(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200"
                  />
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Ngày trả phòng</label>
                  <input
                    type="date"
                    value={checkOutDate}
                    onChange={(e) => setCheckOutDate(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200"
                  />
                </div>
              </div>

              <div className="p-3.5 rounded-2xl bg-teal-50/70 border border-teal-100 space-y-2">
                <div className="flex justify-between items-center font-bold text-teal-900">
                  <span>Bảng phân bổ giá {computedRates.length} đêm ({currentRoomType?.name}):</span>
                  <span className="text-sm font-black">{formatVND(roomTotal)}</span>
                </div>
                <div className="space-y-1">
                  {computedRates.map(r => (
                    <div key={r.date} className="flex justify-between text-[11px] text-teal-800">
                      <span>{r.date} ({r.dayName}) · {r.isWeekend ? '🌙 Cuối tuần' : 'Ngày thường'}</span>
                      <span className="font-semibold">{formatVND(r.rate)}</span>
                    </div>

                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Tên khách hàng *</label>
                  <input
                    type="text"

                <div>

                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Nguồn đặt</label>
                  <select
                    value={source}

                <div>

    function GroupBookingModal({ data, onClose, onSuccess }) {
      const [groupName, setGroupName] = useState('');
      const [customerName, setCustomerName] = useState('');
      const [customerPhone, setCustomerPhone] = useState('');
      const [checkInDate, setCheckInDate] = useState('2026-11-13');
      const [checkOutDate, setCheckOutDate] = useState('2026-11-16');
      const [selectedRoomIds, setSelectedRoomIds] = useState([]);
      const [depositTotal, setDepositTotal] = useState(0);
      const [paymentMethod, setPaymentMethod] = useState('transfer');
      const [notes, setNotes] = useState('');
      const [submitting, setSubmitting] = useState(false);

      const toggleRoom = (rId) => {
        if (selectedRoomIds.includes(rId)) {
          setSelectedRoomIds(selectedRoomIds.filter(id => id !== rId));
        } else {
          setSelectedRoomIds([...selectedRoomIds, rId]);
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!selectedRoomIds.length) {
          alert('Vui lòng chọn ít nhất 1 phòng');
          return;
        }
        setSubmitting(true);
        try {
          const res = await authFetch('/api/bookings/group', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              groupName,
              customerName,
              customerPhone,
              checkInDate,
              checkOutDate,
              rooms: selectedRoomIds.map(id => ({ roomId: id })),
              depositTotal: Number(depositTotal) || 0,
              paymentMethod,
              notes
            })
          });
          if (res.ok) {
            onSuccess();
          } else {
            const err = await res.json();
            alert('Lỗi: ' + err.error);
          }
        } catch (e) {
          alert('Lỗi kết nối: ' + e.message);
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl space-y-4 my-8">
            <div className="flex items-center justify-between pb-3 border-b border-slate-100">
              <h3 className="font-extrabold text-lg text-slate-900 flex items-center gap-2">
                <span>👥 Đặt Nhiều Phòng (Đoàn Khách)</span>
              </h3>
              <button onClick={onClose} className="p-1 rounded-xl hover:bg-slate-100 text-slate-400">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div className="grid grid-cols-3 gap-3">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Tên đoàn khách *</label>
                  <input
                    type="text"
                    required
                    placeholder="VD: Đoàn cty FPT..."
                    value={groupName}
                    onChange={(e) => setGroupName(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200"
                  />
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Người đại diện *</label>
                  <input
                    type="text"
                    required
                    placeholder="Họ tên trưởng đoàn"
                    value={customerName}
                    onChange={(e) => setCustomerName(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200"
                  />
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Số điện thoại *</label>
                  <input
                    type="tel"
                    required
                    placeholder="09xxxxxxxx"
                    value={customerPhone}
                    onChange={(e) => setCustomerPhone(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Ngày nhận phòng</label>
                  <input
                    type="date"
                    value={checkInDate}
                    onChange={(e) => setCheckInDate(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200"
                  />
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Ngày trả phòng</label>
                  <input
                    type="date"
                    value={checkOutDate}
                    onChange={(e) => setCheckOutDate(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200"
                  />
                </div>
              </div>

              <div>
                <label className="font-bold text-slate-700 block mb-1">
                  Chọn các phòng cho đoàn ({selectedRoomIds.length} phòng đã chọn):
                </label>
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-48 overflow-y-auto p-2 rounded-2xl bg-slate-50 border border-slate-200">
                  {(data?.rooms || []).map(r => {
                    const prop = (data?.properties || []).find(p => p.id === r.propertyId);
                    const isSelected = selectedRoomIds.includes(r.id);
                    return (
                      <button
                        type="button"
                        key={r.id}
                        onClick={() => toggleRoom(r.id)}
                        className={`p-2 rounded-xl border text-left transition flex items-center justify-between ${
                          isSelected ? 'bg-teal-700 text-white border-teal-700 shadow-sm' : 'bg-white text-slate-700 border-slate-200 hover:border-teal-400'
                        }`}
                      >
                        <div>
                          <div className="font-bold text-xs">{r.name}</div>
                          <div className="text-[10px] opacity-75 truncate">{prop?.name}</div>
                        </div>
                        <span>{isSelected ? '✓' : '＋'}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3 pt-2">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Tổng tiền cọc gộp cả đoàn (VNĐ)</label>

                    type="number"

                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 font-bold"

                <div>
                  <label className="font-bold text-slate-700 block mb-1">Hình thức thanh toán cọc</label>
                  <select
                    value={paymentMethod}
                    onChange={(e) => setPaymentMethod(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200"
                  >
                    {(data?.categories?.paymentMethods || []).map(m => (
                      <option key={m.id} value={m.id}>{m.name}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2.5 rounded-xl bg-slate-100 font-bold text-slate-600"
                >
                  Hủy
                </button>
                <button
                  type="submit"
                  disabled={submitting}
                  className="px-5 py-2.5 rounded-xl bg-teal-700 hover:bg-teal-800 text-white font-bold shadow-md shadow-teal-700/20"
                >
                  {submitting ? 'Đang tạo đoàn...' : '🚀 Tạo Đơn Đoàn'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================

    function PaymentModal({ data, initialBooking, onClose, onSuccess }) {
      const [bookingId, setBookingId] = useState(initialBooking?.id || '');

        e.preventDefault();
        setSubmitting(true);
        try {
          const res = await authFetch('/api/payments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              bookingId,
              amount: Number(amount),
              type,
              method,
              notes
            })
          });
          if (res.ok) {
            onSuccess();
          } else {
            alert('Lỗi tạo phiếu thu');

          alert('Lỗi kết nối: ' + e.message);
        } finally {
          setSubmitting(false);

        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">

                    value={tier}
                    onChange={(e) => setTier(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200"
                  >
                    <option value="regular">Thường</option>
                    <option value="loyal">Thân thiết</option>
                    <option value="vip">👑 VIP</option>
                  </select>
                </div>
              </div>

              <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl bg-slate-100 font-bold text-slate-600">Hủy</button>
                <button type="submit" disabled={submitting} className="px-5 py-2 rounded-xl bg-teal-700 text-white font-bold shadow-md">
                  Lưu Khách Hàng
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // MODAL: USER & PERMISSION MATRIX MODAL
    // ==========================================
    function UserModal({ data, onClose, onSuccess }) {
      const [name, setName] = useState('');
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('123');
      const [phone, setPhone] = useState('');
      const [email, setEmail] = useState('');
      const [role, setRole] = useState('user');
      const [roleLabel, setRoleLabel] = useState('Lễ tân');
      const [propertyScope, setPropertyScope] = useState('all');
      const [permissions, setPermissions] = useState({
        booking: { view: true, add: true, edit: true, delete: false },
        payment: { view: true, add: true, edit: false, delete: false },
        housekeeping: { view: true, add: false, edit: true, delete: false },
        customer: { view: true, add: true, edit: true, delete: false },
        reports: { view: false, add: false, edit: false, delete: false },
        property: { view: true, add: false, edit: false, delete: false },
        settings: { view: false, add: false, edit: false, delete: false }
      });
      const [submitting, setSubmitting] = useState(false);

      const applyPreset = (preset) => {
        if (preset === 'admin') {
          setRole('admin');
          setRoleLabel('Quản trị viên');
          setPropertyScope('all');
          const p = {};
          ['booking', 'payment', 'housekeeping', 'customer', 'reports', 'property', 'settings'].forEach(k => {
            p[k] = { view: true, add: true, edit: true, delete: true };
          });
          setPermissions(p);
        } else if (preset === 'letan') {
          setRole('user');
          setRoleLabel('Lễ tân');
          setPermissions({
            booking: { view: true, add: true, edit: true, delete: false },
            payment: { view: true, add: true, edit: false, delete: false },
            housekeeping: { view: true, add: false, edit: true, delete: false },
            customer: { view: true, add: true, edit: true, delete: false },
            reports: { view: false, add: false, edit: false, delete: false },
            property: { view: true, add: false, edit: false, delete: false },
            settings: { view: false, add: false, edit: false, delete: false }
          });
        } else if (preset === 'ketoan') {
          setRole('user');
          setRoleLabel('Kế toán');
          setPermissions({
            booking: { view: true, add: false, edit: false, delete: false },
            payment: { view: true, add: true, edit: true, delete: true },
            housekeeping: { view: false, add: false, edit: false, delete: false },
            customer: { view: true, add: false, edit: false, delete: false },
            reports: { view: true, add: false, edit: false, delete: false },
            property: { view: true, add: false, edit: false, delete: false },
            settings: { view: false, add: false, edit: false, delete: false }
          });
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSubmitting(true);
        try {
          const res = await authFetch('/api/users', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name,
              username,
              password,
              phone,
              email,
              role,
              roleLabel,
              propertyScope,
              propertyScopeLabel: propertyScope === 'all' ? 'Tất cả' : (data?.properties.find(p => p.id === propertyScope)?.name || 'Cơ sở'),
              permissionsSummary: 'Theo ma trận quyền',
              permissions
            })
          });
          if (res.ok) onSuccess();
        } catch (e) {
          alert('Lỗi: ' + e.message);
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl space-y-4 text-xs my-8">
            <div className="flex items-center justify-between pb-3 border-b border-slate-100">
              <h3 className="font-extrabold text-base text-slate-900">👤 Sửa / Thêm Người Dùng & Phân Quyền</h3>
              <button onClick={onClose} className="p-1 rounded-xl hover:bg-slate-100 text-slate-400">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Họ tên *</label>
                  <input
                    type="text"
                    required
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200"
                  />
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Tài khoản đăng nhập *</label>
                  <input
                    type="text"
                    required
                    value={username}
                    onChange={(e) => setUsername(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 font-mono"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Mật khẩu khởi tạo</label>
                  <input
                    type="password"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 font-mono"
                  />
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Số điện thoại</label>
                  <input
                    type="tel"
                    value={phone}
                    onChange={(e) => setPhone(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200"
                  />
                </div>
              </div>

              <div>
                <label className="font-bold text-slate-700 block mb-1">Phạm vi cơ sở (Giới hạn lễ tân chỉ thấy cơ sở được giao):</label>
                <div className="flex flex-wrap gap-2">
                  <button
                    type="button"
                    onClick={() => setPropertyScope('all')}
                    className={`px-3 py-1.5 rounded-xl border font-bold ${propertyScope === 'all' ? 'bg-teal-700 text-white' : 'bg-slate-50 text-slate-700'}`}
                  >
                    Tất cả cơ sở
                  </button>
                  {(data?.properties || []).map(p => (
                    <button
                      type="button"
                      key={p.id}
                      onClick={() => setPropertyScope(p.id)}
                      className={`px-3 py-1.5 rounded-xl border font-bold ${propertyScope === p.id ? 'bg-teal-700 text-white' : 'bg-slate-50 text-slate-700'}`}
                    >
                      {p.name}
                    </button>
                  ))}
                </div>
              </div>

              <div className="pt-2 border-t border-slate-100">
                <div className="flex items-center justify-between mb-2">
                  <label className="font-bold text-slate-800">Ma trận quyền hạn</label>
                  <div className="flex gap-1">
                    <button type="button" onClick={() => applyPreset('letan')} className="px-2 py-0.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-[10px]">
                      Preset Lễ tân
                    </button>
                    <button type="button" onClick={() => applyPreset('ketoan')} className="px-2 py-0.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-[10px]">
                      Preset Kế toán
                    </button>
                    <button type="button" onClick={() => applyPreset('admin')} className="px-2 py-0.5 rounded bg-teal-100 text-teal-800 font-semibold text-[10px]">
                      Toàn quyền
                    </button>
                  </div>
                </div>

                <div className="border border-slate-200 rounded-2xl overflow-hidden">
                  <table className="w-full text-[11px] text-left">
                    <thead className="bg-slate-50 border-b border-slate-200 font-bold text-slate-600">
                      <tr>
                        <th className="p-2.5">Chức năng</th>
                        <th className="p-2.5 text-center">Xem</th>
                        <th className="p-2.5 text-center">Thêm</th>
                        <th className="p-2.5 text-center">Sửa</th>
                        <th className="p-2.5 text-center">Xóa</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 font-medium">
                      {[
                        { id: 'booking', label: 'Đặt phòng & lịch phòng' },
                        { id: 'payment', label: 'Thu tiền' },
                        { id: 'housekeeping', label: 'Buồng phòng' },
                        { id: 'customer', label: 'Khách hàng' },
                        { id: 'reports', label: 'Báo cáo' },
                        { id: 'property', label: 'Cơ sở & phòng' },
                        { id: 'settings', label: 'Cài đặt' }
                      ].map(item => {
                        const cur = permissions[item.id] || { view: false, add: false, edit: false, delete: false };
                        return (
                          <tr key={item.id} className="hover:bg-slate-50/50">
                            <td className="p-2.5 font-bold text-slate-800">{item.label}</td>
                            {['view', 'add', 'edit', 'delete'].map(action => (
                              <td key={action} className="p-2.5 text-center">
                                <input
                                  type="checkbox"
                                  checked={!!cur[action]}
                                  onChange={(e) => {
                                    setPermissions({
                                      ...permissions,
                                      [item.id]: { ...cur, [action]: e.target.checked }
                                    });
                                  }}
                                  className="w-4 h-4 rounded text-teal-700"
                                />
                              </td>
                            ))}
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>

              <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl bg-slate-100 font-bold text-slate-600">Đóng</button>
                <button type="submit" disabled={submitting} className="px-5 py-2 rounded-xl bg-teal-700 text-white font-bold shadow-md">
                  Lưu Người Dùng
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
